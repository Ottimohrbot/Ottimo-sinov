<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ottimo — Sinov tizimi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#faf9f7;--surface:#ffffff;--card:#f4f2ee;--border:#e8e4dc;--border2:#d4cfc4;
  --accent:#2c5f2e;--accent2:#4a8c4d;--accent-light:#e8f0e8;
  --gold:#c8973a;--gold-light:#fdf3e3;
  --text:#1a1a18;--muted:#6b6860;--muted2:#9b9890;
  --success:#2c7a4b;--warning:#b87a1a;--danger:#b83c3c;--info:#2a5fa8;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 40px rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:'Playfair Display',serif}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent);display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s}
.nav-btn:hover{color:var(--text);background:var(--card)}
.nav-btn.active{color:var(--accent);background:var(--accent-light)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 14px 6px 8px;font-size:13px;cursor:pointer;font-weight:500}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.main{padding:36px 32px;max-width:1000px;margin:0 auto;width:100%}
.app{display:flex;flex-direction:column;min-height:100vh}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,0.05)}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}
.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}.mb-32{margin-bottom:32px}
.stat-val{font-family:'Playfair Display',serif;font-size:40px;line-height:1;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.badge-green{background:#e8f5ee;color:#2c7a4b;border:1px solid #b8ddc8}
.badge-amber{background:#fdf3e3;color:#b87a1a;border:1px solid #f0d49a}
.badge-red{background:#fdf0f0;color:#b83c3c;border:1px solid #f0c4c4}
.badge-blue{background:#e8f0fc;color:#2a5fa8;border:1px solid #b8cef0}
.badge-gold{background:var(--gold-light);color:var(--gold);border:1px solid #f0d49a}
.badge-gray{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 20px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(44,95,46,0.3)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);background:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:14px 28px;font-size:15px;border-radius:var(--radius)}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:border .2s;font-weight:500}
.input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(44,95,46,0.08)}
.input.error{border-color:var(--danger)}
.input::placeholder{color:var(--muted2)}
.input-hint{font-size:12px;color:var(--muted);margin-top:5px}
.input-error{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:80px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);background:var(--card)}
td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:500}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg)}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.pos-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:18px 14px;cursor:pointer;text-align:center;transition:all .25s;position:relative}
.pos-card:hover{border-color:var(--accent2);background:var(--accent-light);transform:translateY(-2px)}
.pos-card.selected{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 3px rgba(44,95,46,0.15)}
.pos-card .pos-icon{font-size:28px;margin-bottom:8px}
.pos-card .pos-name{font-size:13px;font-weight:700}
.pos-card .check{position:absolute;top:8px;right:8px;width:20px;height:20px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;color:#fff;font-size:11px;font-weight:700}
.pos-card.selected .check{opacity:1}
.progress-track{height:5px;background:var(--border);border-radius:10px;overflow:hidden;margin:14px 0 6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .5s ease}
.q-cat{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.q-text{font-family:'Playfair Display',serif;font-size:20px;line-height:1.4;color:var(--text);margin-bottom:22px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 18px;cursor:pointer;font-size:14px;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s;width:100%}
.choice:hover{border-color:var(--accent2);background:var(--accent-light)}
.choice.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.login-wrap{min-height:100vh;display:flex;background:var(--bg)}
.login-left{flex:1;background:linear-gradient(145deg,var(--accent) 0%,#1a3d1c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:#fff}
.login-logo{font-family:'Playfair Display',serif;font-size:44px;color:#fff;margin-bottom:12px}
.login-tagline{font-size:14px;color:rgba(255,255,255,0.7);line-height:1.7;text-align:center;max-width:260px}
.login-right{width:500px;display:flex;align-items:center;justify-content:center;padding:48px;overflow-y:auto}
.login-box{width:100%}
.login-title{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.login-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:22px}
.login-tab{flex:1;padding:9px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;background:transparent;color:var(--muted);transition:all .2s}
.login-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.step-dots{display:flex;gap:8px;margin-bottom:24px;justify-content:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.step-dot.active{background:var(--accent);width:24px;border-radius:4px}
.step-dot.done{background:var(--accent2)}
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;animation:slideIn .3s ease;box-shadow:var(--shadow-lg);max-width:320px}
.toast-success{background:var(--accent);color:#fff}
.toast-danger{background:var(--danger);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .4s ease}
@media(max-width:768px){
  .login-left{display:none}.login-right{width:100%;padding:24px}
  .grid-4,.grid-3{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}
  .pos-grid{grid-template-columns:1fr 1fr}.topbar{padding:0 16px}.main{padding:20px 16px}
}
</style>
</head>

function isValidEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||'').trim())}
function isValidPhone(p){return /^[\+]?[0-9]{9,13}$/.test(String(p||'').replace(/[\s\-\(\)]/g,''))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

let S={
  user:null,userRole:null,userData:null,
  page:'login',loginTab:'manager',
  regStep:1,
  regName:'',regEmail:'',regPhone:'',regAddress:'',regPosition:'',
  regErrors:{},
  examAnswers:{},examStep:0,examResult:null,
  selfScore:0,selfNote:'',
  employees:[],exams:[],
  search:'',toast:null,loading:true,
};

function render(){
  const root=document.getElementById('root');
  if(S.loading){
    root.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="font-family:Playfair Display,serif;font-size:28px;color:#2c5f2e">Ottimo...</div></div>';
    return;
  }
  if(!S.user){root.innerHTML=renderLogin();}
  else{root.innerHTML=renderApp();}
}

function renderLogin(){
  return`
  ${S.toast?`<div class="toast toast-${S.toast.type}">${S.toast.msg}</div>`:''}
  <div class="login-wrap">
    <div class="login-left">
      <div class="login-logo">Ottimo</div>
      <p class="login-tagline">Xodimlarni sinov muddatida baholash va rivojlantirish tizimi</p>
      <div style="margin-top:40px;display:flex;flex-direction:column;gap:14px">
        ${Object.values(POSITIONS).map(p=>`<div style="display:flex;align-items:center;gap:10px;color:rgba(255,255,255,0.75);font-size:14px;font-weight:500"><span style="font-size:20px">${p.icon}</span>${p.label}</div>`).join('')}
      </div>
    </div>
    <div class="login-right">
      <div class="login-box fade-up">
        <div class="login-title">${S.loginTab==='manager'?'Rahbar kirish':'Hodim imtihoni'}</div>
        <div class="login-sub">${S.loginTab==='manager'?'Boshqaruv paneliga kirish':'Ma\'lumotlarni to\'ldiring'}</div>
        <div class="login-tabs">
          <button class="login-tab ${S.loginTab==='manager'?'active':''}" onclick="setTab('manager')">Rahbar</button>
          <button class="login-tab ${S.loginTab==='employee'?'active':''}" onclick="setTab('employee')">Hodim</button>
        </div>
        ${S.loginTab==='manager'?renderManagerLogin():renderEmpFlow()}
      </div>
    </div>
  </div>`;
}

function renderManagerLogin(){
  return`
  <div class="field"><label>Email</label>
    <input class="input" id="l-email" type="email" placeholder="rahbar@ottimo.uz"/>
  </div>
  <div class="field"><label>Parol</label>
    <input class="input" id="l-pass" type="password" placeholder="••••••••"/>
  </div>
  <div class="field"><label>Ism (yangi hisob uchun)</label>
    <input class="input" id="l-name" placeholder="Ism Familiya"/>
  </div>
  <button class="btn btn-primary btn-full btn-lg" style="margin-top:8px" onclick="doLogin()">Kirish →</button>`;
}

function renderEmpFlow(){
  if(S.regStep===1)return renderStep1();
  if(S.regStep===2)return renderStep2();
  if(S.regStep===3)return renderExam();
  if(S.regStep===4)return renderDone();
  return renderStep1();
}

function renderStep1(){
  const e=S.regErrors;
  return`
  <div class="step-dots">
    <div class="step-dot active"></div><div class="step-dot"></div><div class="step-dot"></div>
  </div>
  <div class="section-label">Shaxsiy ma'lumotlar</div>
  <div class="field">
    <label>Ism va familiya *</label>
    <input class="input${e.name?' error':''}" id="f-name" type="text" placeholder="To'liq ismingiz" value="${esc(S.regName)}"/>
    ${e.name?`<div class="input-error">⚠ ${e.name}</div>`:''}
  </div>
  <div class="field">
    <label>Email *</label>
    <input class="input${e.email?' error':''}" id="f-email" type="email" placeholder="email@gmail.com" value="${esc(S.regEmail)}"/>
    ${e.email?`<div class="input-error">⚠ ${e.email}</div>`:`<div class="input-hint">To'g'ri format: ism@gmail.com</div>`}
  </div>
  <div class="field">
    <label>Telefon *</label>
    <input class="input${e.phone?' error':''}" id="f-phone" type="tel" placeholder="+998901234567" value="${esc(S.regPhone)}"/>
    ${e.phone?`<div class="input-error">⚠ ${e.phone}</div>`:`<div class="input-hint">Masalan: +998901234567</div>`}
  </div>
  <div class="field">
    <label>Manzil *</label>
    <input class="input${e.address?' error':''}" id="f-address" type="text" placeholder="Toshkent, Chilonzor tumani" value="${esc(S.regAddress)}"/>
    ${e.address?`<div class="input-error">⚠ ${e.address}</div>`:''}
  </div>
  <button class="btn btn-primary btn-full btn-lg" onclick="goStep2()" style="margin-top:8px">Davom etish →</button>`;
}

function renderStep2(){
  return`
  <div class="step-dots">
    <div class="step-dot done"></div><div class="step-dot active"></div><div class="step-dot"></div>
  </div>
  <div class="section-label">Kasbingizni tanlang</div>
  ${S.regErrors.position?`<div class="input-error mb-16">⚠ Iltimos kasbni tanlang</div>`:''}
  <div class="pos-grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
    ${Object.entries(POSITIONS).map(([k,v])=>`
    <div class="pos-card${S.regPosition===k?' selected':''}" onclick="pickPos('${k}')">
      <div class="check">✓</div>
      <div class="pos-icon">${v.icon}</div>
      <div class="pos-name">${v.label}</div>
    </div>`).join('')}
  </div>
  <div class="flex gap-8">
    <button class="btn btn-ghost" onclick="S.regStep=1;render()">← Orqaga</button>
    <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="goStep3()">Imtihonni boshlash →</button>
  </div>`;
}

function renderExam(){
  const qs=POSITIONS[S.regPosition].questions;
  const step=S.examStep;
  const isLast=step>=qs.length;
  const pct=Math.round((step/(qs.length+1))*100);
  return`
  <div class="step-dots">
    <div class="step-dot done"></div><div class="step-dot done"></div><div class="step-dot active"></div>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:18px">
    ${isLast?'Yakuniy baholash':'Savol '+(step+1)+' / '+qs.length}
  </div>
  ${isLast?`
  <div class="q-cat">O'zingizni baholang</div>
  <div class="q-text" style="font-size:18px">Umumiy ish faoliyatingizni qanday baholaysiz?</div>
  <div class="choices">
    ${["A'lo — barcha vazifalarni zo'r bajaraman","Yaxshi — ko'p narsani uddalay olaman","O'rtacha — ba'zi narsalar hali qiyin","Rivojlanish kerak — ko'p narsani o'rganishim lozim"].map((o,i)=>`
    <button class="choice${S.selfScore===i+1?' selected':''}" onclick="S.selfScore=${i+1};render()">${o}</button>`).join('')}
  </div>
  <div class="field" style="margin-top:14px">
    <label>Qo'shimcha izoh (ixtiyoriy)</label>
    <textarea class="input" id="self-note" rows="3" placeholder="O'zingiz haqida qo'shimcha...">${esc(S.selfNote)}</textarea>
  </div>
  <div class="flex gap-8" style="margin-top:14px">
    <button class="btn btn-ghost" onclick="S.examStep=${qs.length-1};render()">← Orqaga</button>
    <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="submitExam()">Yuborish ✓</button>
  </div>
  `:`
  <div class="q-cat">${qs[step].cat}</div>
  <div class="q-text">${qs[step].text}</div>
  <div class="choices">
    ${qs[step].options.map((o,oi)=>`
    <button class="choice${S.examAnswers[qs[step].id]===String(oi)?' selected':''}" onclick="pickAns('${qs[step].id}','${oi}')">${o}</button>`).join('')}
  </div>
  <div class="flex gap-8" style="margin-top:22px">
    <button class="btn btn-ghost"${step===0?' disabled':''} onclick="S.examStep--;render()">← Oldingi</button>
    <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="S.examStep++;render()">
      ${step===qs.length-1?'Yakunlash →':'Keyingi →'}
    </button>
  </div>`}`;
}

function renderDone(){
  const r=S.examResult;
  if(!r)return'';
  const color=r.finalScore>=85?'var(--success)':r.finalScore>=65?'var(--warning)':'var(--danger)';
  const icon=r.finalScore>=85?'🏆':r.finalScore>=65?'📊':'📋';
  return`
  <div style="text-align:center;padding:16px 0">
    <div style="font-size:52px;margin-bottom:12px">${icon}</div>
    <div style="font-family:'Playfair Display',serif;font-size:68px;color:${color};line-height:1">${r.finalScore}%</div>
    <div style="margin:12px 0">${scoreBadge(r.finalScore)}</div>
    <p style="font-size:14px;color:var(--muted);margin:16px 0;line-height:1.6">
      ${r.finalScore>=85?'Tabriklaymiz! Natijalaringiz rahbarga yuborildi.':r.finalScore>=65?"Yaxshi natija! Rahbar siz bilan bog'lanadi.":'Natijalaringiz rahbarga yuborildi.'}
    </p>
    <div class="grid-2" style="margin-top:16px;text-align:left">
      <div class="card-sm"><div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px">Savol-javob</div><div style="font-size:24px;font-weight:700">${r.empScore}%</div></div>
      <div class="card-sm"><div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px">O'z bahosi</div><div style="font-size:24px;font-weight:700;color:var(--gold)">${r.selfScorePct}%</div></div>
    </div>
  </div>`;
}

function renderApp(){
  const pages=['home','employees','results'];
  const labels={home:'Bosh sahifa',employees:'Hodimlar',results:'Natijalar'};
  let content='';
  if(S.page==='home')content=renderHome();
  else if(S.page==='employees')content=renderEmployees();
  else if(S.page==='results')content=renderResults();
  return`
  ${S.toast?`<div class="toast toast-${S.toast.type}">${S.toast.msg}</div>`:''}
  <div class="app">
    <div class="topbar">
      <div class="logo"><div class="logo-dot"></div>Ottimo</div>
      <nav class="nav">${pages.map(p=>`<button class="nav-btn${S.page===p?' active':''}" onclick="S.page='${p}';render()">${labels[p]}</button>`).join('')}</nav>
      <div class="user-chip" onclick="doLogout()">
        <div class="avatar">${(S.userData?.name||S.user.email)[0].toUpperCase()}</div>
        <span style="font-weight:600">${S.userData?.name||'Rahbar'}</span>
        <span style="color:var(--muted);font-size:12px">↗ Chiqish</span>
      </div>
    </div>
    <div class="main">${content}</div>
  </div>`;
}

  const passed=S.exams.filter(e=>e.finalScore>=85).length;
  const monitor=S.exams.filter(e=>e.finalScore>=65&&e.finalScore<85).length;
  const avg=S.exams.length?Math.round(S.exams.reduce((a,e)=>a+e.finalScore,0)/S.exams.length):0;
  const recent=[...S.exams].sort((a,b)=>b.timestamp-a.timestamp).slice(0,6);
  return`
  <div class="fade-up">
    <h1 style="font-size:32px;margin-bottom:4px">Bosh sahifa</h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:28px">Ottimo HR — Sinov muddati boshqaruvi</p>
    <div class="grid-4 mb-24">
      ${[{l:'Hodimlar',v:S.employees.length,c:'var(--accent)'},{l:'Qabul qilindi',v:passed,c:'var(--success)'},{l:'Monitoring',v:monitor,c:'var(--warning)'},{l:"O'rtacha ball",v:avg+'%',c:'var(--info)'}]
        .map(s=>`<div class="card-sm"><div class="stat-val" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('')}
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="section-label">So'nggi imtihonlar</div>
        ${recent.length===0?`<p style="color:var(--muted);text-align:center;padding:24px 0;font-size:14px">Hali imtihon yo'q</p>`:
          recent.map(ex=>`<div class="flex-between" style="padding:12px 0;border-bottom:1px solid var(--border)">
            <div class="flex gap-12">
              <div style="width:36px;height:36px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${POSITIONS[ex.position]?.icon||'👤'}</div>
              <div><div style="font-size:14px;font-weight:600">${ex.employeeName}</div>
              <div style="font-size:12px;color:var(--muted)">${POSITIONS[ex.position]?.label||''} · ${ex.date||''}</div></div>
            </div>
            <div class="flex gap-8">
              <span style="font-size:18px;font-weight:700;color:${ex.finalScore>=85?'var(--success)':ex.finalScore>=65?'var(--warning)':'var(--danger)'}">${ex.finalScore}%</span>
              ${scoreBadge(ex.finalScore)}
            </div>
          </div>`).join('')}
      </div>
      <div class="card">
        <div class="section-label">Kasblar bo'yicha</div>
        ${Object.entries(POSITIONS).map(([k,v])=>{
          const cnt=S.exams.filter(e=>e.position===k).length;
          const av=cnt?Math.round(S.exams.filter(e=>e.position===k).reduce((a,e)=>a+e.finalScore,0)/cnt):0;
          return`<div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
            <div class="flex gap-8"><span style="font-size:18px">${v.icon}</span><span style="font-size:13px;font-weight:600">${v.label}</span></div>
            <div class="flex gap-8"><span style="font-size:12px;color:var(--muted)">${cnt} ta</span>${cnt?`<span style="font-size:13px;font-weight:700;color:${av>=85?'var(--success)':av>=65?'var(--warning)':'var(--danger)'}">${av}%</span>`:'<span style="color:var(--muted)">—</span>'}</div>
          </div>`;}).join('')}
      </div>
    </div>
  </div>`;
}

function renderResults(){
  const sorted=[...S.exams].sort((a,b)=>b.timestamp-a.timestamp);
  const passed=sorted.filter(e=>e.finalScore>=85).length;
  const monitor=sorted.filter(e=>e.finalScore>=65&&e.finalScore<85).length;
  const failed=sorted.filter(e=>e.finalScore<65).length;
  return`
  <div class="fade-up">
    <h1 style="font-size:28px;margin-bottom:20px">Natijalar</h1>
    <div class="grid-3 mb-24">
      ${[{l:'Qabul (≥85%)',v:passed,c:'var(--success)'},{l:'Monitoring (65–84%)',v:monitor,c:'var(--warning)'},{l:'Rad (< 65%)',v:failed,c:'var(--danger)'}]
        .map(s=>`<div class="card-sm"><div class="stat-val" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('')}
    </div>
    ${sorted.length===0?`<div class="card" style="text-align:center;padding:48px"><p style="color:var(--muted)">Hali natija yo'q</p></div>`:`
    <div class="table-wrap"><table>
      <thead><tr><th>Hodim</th><th>Kasb</th><th>Telefon</th><th>Manzil</th><th>Sana</th><th>Ball</th><th>Holat</th></tr></thead>
      <tbody>${sorted.map(ex=>`<tr>
        <td><div class="flex gap-12">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${POSITIONS[ex.position]?.icon||'👤'}</div>
          <div><div style="font-weight:600">${ex.employeeName}</div><div style="font-size:12px;color:var(--muted)">${ex.email||''}</div></div>
        </div></td>
        <td><span class="badge badge-gray">${POSITIONS[ex.position]?.label||ex.position||'—'}</span></td>
        <td style="font-size:13px;color:var(--muted)">${ex.phone||'—'}</td>
        <td style="font-size:13px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ex.address||'—'}</td>
        <td style="font-size:13px;color:var(--muted)">${ex.date||''}</td>
        <td><span style="font-size:18px;font-weight:700;color:${ex.finalScore>=85?'var(--success)':ex.finalScore>=65?'var(--warning)':'var(--danger)'}">${ex.finalScore}%</span></td>
        <td>${scoreBadge(ex.finalScore)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`}
  </div>`;
}

function scoreBadge(s){
  if(s>=85)return'<span class="badge badge-green">✓ Qabul</span>';
  if(s>=65)return'<span class="badge badge-amber">◎ Monitoring</span>';
  return'<span class="badge badge-red">✗ Rad</span>';
}
function daysLeft(d){const end=new Date(new Date(d).getTime()+30*24*60*60*1000);return Math.ceil((end-new Date())/(1000*60*60*24));}
function computeScore(answers,qs){
  let total=0,count=0;
  qs.forEach(q=>{
    const idx=parseInt(answers[q.id]);
    if(!isNaN(idx)){total+=((q.options.length-idx)/q.options.length)*100;count++;}
  });
  return count?Math.round(total/count):50;
}

window.setTab=(t)=>{
  Object.assign(S,{loginTab:t,regStep:1,regName:'',regEmail:'',regPhone:'',regAddress:'',regPosition:'',regErrors:{},examAnswers:{},examStep:0,examResult:null,selfScore:0,selfNote:''});
  render();
};
window.pickPos=(k)=>{S.regPosition=k;render();};
window.pickAns=(id,idx)=>{S.examAnswers[id]=idx;render();};

window.goStep2=()=>{
  const name=document.getElementById('f-name')?.value?.trim()||'';
  const email=document.getElementById('f-email')?.value?.trim()||'';
  const phone=document.getElementById('f-phone')?.value?.trim()||'';
  const address=document.getElementById('f-address')?.value?.trim()||'';
  S.regName=name;S.regEmail=email;S.regPhone=phone;S.regAddress=address;
  const errors={};
  if(name.length<3)errors.name="Ism kamida 3 harfdan iborat bo'lsin";
  if(!isValidEmail(email))errors.email="To'g'ri email kiriting (masalan: ism@gmail.com)";
  if(!isValidPhone(phone))errors.phone="To'g'ri telefon kiriting (+998901234567)";
  if(address.length<5)errors.address="Manzilni to'liq kiriting";
  S.regErrors=errors;
  if(Object.keys(errors).length>0){render();return;}
  S.regStep=2;render();
};

window.goStep3=()=>{
  if(!S.regPosition){S.regErrors={position:true};render();return;}
  S.regErrors={};S.regStep=3;S.examAnswers={};S.examStep=0;render();
};

window.submitExam=async()=>{
  const noteEl=document.getElementById('self-note');
  if(noteEl)S.selfNote=noteEl.value;
  const pos=POSITIONS[S.regPosition];
  const empScore=computeScore(S.examAnswers,pos.questions);
  const selfScorePct=[100,75,50,25][S.selfScore-1]||50;
  const final=Math.round(empScore*0.8+selfScorePct*0.2);
  const result={
    employeeName:S.regName,email:S.regEmail,phone:S.regPhone,address:S.regAddress,
    position:S.regPosition,answers:S.examAnswers,empScore,selfScorePct,finalScore:final,
    selfNote:S.selfNote,date:new Date().toLocaleDateString('uz-UZ'),timestamp:Date.now(),
  };
  try{
    await addDoc(collection(db,'exams'),result);
    await addDoc(collection(db,'employees'),{
      name:S.regName,email:S.regEmail,phone:S.regPhone,address:S.regAddress,
      position:S.regPosition,startDate:new Date().toISOString().split('T')[0],
      status:final>=85?'passed':final>=65?'monitor':'failed',
      lastScore:final,createdAt:serverTimestamp(),
    });
    await loadData();
    S.examResult=result;S.regStep=4;render();
  }catch(err){showToast('Xatolik: '+err.message,'danger');}
};

window.doLogin=async()=>{
  const email=document.getElementById('l-email')?.value?.trim();
  const pass=document.getElementById('l-pass')?.value;
  const name=document.getElementById('l-name')?.value?.trim();
  if(!email||!pass)return showToast('Email va parol kiriting','danger');
  if(!isValidEmail(email))return showToast("To'g'ri email kiriting: ism@gmail.com",'danger');
  try{
    let cred;
    try{cred=await signInWithEmailAndPassword(auth,email,pass);}
    catch{
      if(!name)return showToast("Yangi hisob: ismingizni kiriting",'danger');
      cred=await createUserWithEmailAndPassword(auth,email,pass);
      await setDoc(doc(db,'users',cred.user.uid),{name,email,role:'manager',createdAt:serverTimestamp()});
    }
  }catch(err){
    const m={'auth/wrong-password':"Parol noto'g'ri",'auth/user-not-found':'Foydalanuvchi topilmadi','auth/invalid-credential':"Email yoki parol noto'g'ri"};
    showToast(m[err.code]||'Xatolik: '+err.message,'danger');
  }
};
window.doLogout=async()=>await signOut(auth);

function showToast(msg,type='success'){
  S.toast={msg,type};render();
  setTimeout(()=>{S.toast=null;render();},3500);
}
async function loadData(){
  try{
    const[emps,exs]=await Promise.all([
      getDocs(collection(db,'employees')),
      getDocs(query(collection(db,'exams'),orderBy('timestamp','desc'))),
    ]);
    S.employees=emps.docs.map(d=>({id:d.id,...d.data()}));
    S.exams=exs.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){console.warn(e);}
}
onAuthStateChanged(auth,async(user)=>{
  if(user){
    const ud=await getDoc(doc(db,'users',user.uid));
    S.user=user;S.userData=ud.exists()?ud.data():null;
    S.page='home';await loadData();
  }else{S.user=null;S.userData=null;S.page='login';}
  S.loading=false;render();
});
render();
</script>
</body>
</html>
