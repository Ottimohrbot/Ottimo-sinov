<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ottimo — Sinov tizimi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#faf9f7;
  --surface:#ffffff;
  --card:#f4f2ee;
  --border:#e8e4dc;
  --border2:#d4cfc4;
  --accent:#2c5f2e;
  --accent2:#4a8c4d;
  --accent-light:#e8f0e8;
  --gold:#c8973a;
  --gold-light:#fdf3e3;
  --text:#1a1a18;
  --muted:#6b6860;
  --muted2:#9b9890;
  --success:#2c7a4b;
  --warning:#b87a1a;
  --danger:#b83c3c;
  --info:#2a5fa8;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 2px 16px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,.serif{font-family:'Playfair Display',serif}
/* (Avvalgi stillar saqlab qolindi) */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent);letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%;display:inline-block}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s;letter-spacing:0.3px}
.nav-btn:hover{color:var(--text);background:var(--card)}
.nav-btn.active{color:var(--accent);background:var(--accent-light)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 14px 6px 8px;font-size:13px;cursor:pointer;font-weight:500;transition:all .2s}
.user-chip:hover{border-color:var(--border2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.main{flex:1;padding:36px 32px;max-width:1000px;margin:0 auto;width:100%}
.app{display:flex;flex-direction:column;min-height:100vh}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,0.05)}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.flex{display:flex;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 20px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .2s;letter-spacing:0.3px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(44,95,46,0.3)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:14px 28px;font-size:15px;border-radius:var(--radius)}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:all .2s;font-weight:500}
.input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(44,95,46,0.08)}
.input.error{border-color:var(--danger);background:#fdf8f8}
.input-error{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.pos-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:20px 16px;cursor:pointer;text-align:center;transition:all .25s;position:relative}
.pos-card.selected{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 3px rgba(44,95,46,0.15)}
.check{position:absolute;top:10px;right:10px;width:20px;height:20px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.pos-card.selected .check{opacity:1}
.progress-track{height:5px;background:var(--border);border-radius:10px;overflow:hidden;margin:14px 0 6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .5s ease}
.q-cat{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.q-text{font-family:'Playfair Display',serif;font-size:24px;line-height:1.4;color:var(--text);margin-bottom:28px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 18px;cursor:pointer;font-size:14px;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s}
.choice:hover{border-color:var(--accent2);background:var(--accent-light)}
.choice.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.stars{display:flex;gap:6px;margin-bottom:8px}
.star{font-size:32px;cursor:pointer;color:var(--border2);transition:all .15s;user-select:none;line-height:1}
.star.on{color:var(--gold)}
.login-wrap{min-height:100vh;display:flex;background:var(--bg)}
.login-left{flex:1;background:linear-gradient(145deg,var(--accent) 0%,#1a3d1c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:#fff;position:relative;overflow:hidden}
.login-logo{font-family:'Playfair Display',serif;font-size:42px;color:#fff;margin-bottom:12px}
.login-right{width:480px;display:flex;align-items:center;justify-content:center;padding:48px}
.login-box{width:100%}
.login-title{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:6px}
.login-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:28px}
.login-tab{flex:1;padding:9px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;background:transparent;color:var(--muted);transition:all .2s}
.login-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.step-dots{display:flex;gap:8px;margin-bottom:32px;justify-content:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.step-dot.active{background:var(--accent);width:24px;border-radius:4px}
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:#fff}
.toast-danger{background:var(--danger)}
.fade-up{animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,getDocs,query,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBkFbcT--VfrLe2ZMjxhmRAs1V7Svzx2Bg",
  authDomain:"ottimo-hr.firebaseapp.com",
  projectId:"ottimo-hr",
  storageBucket:"ottimo-hr.firebasestorage.app",
  messagingSenderId:"130893452321",
  appId:"1:130893452321:web:d70ddfc1fffc57a1c97f60"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const POSITIONS={
  menejer:{
    label:"Menejer",icon:"👔",color:"#2c5f2e",
    questions:[
      {id:"m1",cat:"IQ/Mantiq",text:"Agar 5 ta mashina 5 minutda 5 ta detal yasasa, 100 ta mashina 100 ta detalni qancha vaqtda yasaydi?",type:"choice",options:["100 minut","5 minut","50 minut","1 minut"]},
      {id:"m2",cat:"IQ/Mantiq",text:"Siz poygada ikkinchi o'rindagi odamdan o'zib ketdingiz. Siz hozir nechanchi o'rindasiz?",type:"choice",options:["Birinchi","Ikkinchi","Uchinchi","Oxirgi"]},
      {id:"m3",cat:"Boshqaruv",text:"Xodimingiz xato qildi, lekin bu xato mijozga sezilmadi. Sizning harakatingiz?",type:"text"},
      {id:"m4",cat:"Mantiq",text:"Otaning 4 ta qizi bor: Lala, Lele, Lulu. To'rtinchi qizining ismi nima?",type:"choice",options:["Lolo","Lili","Bilmayman","Otaning ismi bilan bog'liq"]},
      {id:"m5",cat:"IQ",text:"Qaysi so'z mantiqan guruhga mos kelmaydi?",type:"choice",options:["Olma","Banan","Sabzi","Uzum"]},
      {id:"m6",cat:"Qaror qabul qilish",text:"Inqiroz paytida birinchi navbatda nima qilinadi?",type:"choice",options:["Xarajatlarni kamaytirish","Xodimlarni bo'shatish","Marketingni to'xtatish","Kutish"]},
      {id:"m7",cat:"IQ",text:"3, 5, 8, 12, ... Ketma-ketlikdagi keyingi sonni toping.",type:"choice",options:["15","17","18","20"]},
      {id:"m8",cat:"Muloqot",text:"Norozi mijoz bilan ishlashda eng muhim qoida nima?",type:"text"},
      {id:"m9",cat:"Mantiq",text:"Qaysi oyda 28 kun bor?",type:"choice",options:["Fevral","Yanvar","Hammasida","Hech birida"]},
      {id:"m10",cat:"Strategiya",text:"Kompaniyaning 5 yillik rejasini tuzishda nimaga tayanasiz?",type:"text"}
    ]
  },
  barista:{
    label:"Barista",icon:"☕",color:"#7b4f2e",
    questions:[
      {id:"b1",cat:"IQ",text:"Stakandagi suv har 1 minutda 2 barobar ko'payadi. Agar stakan 60 minutda to'lsa, yarmi qachon to'lgan?",type:"choice",options:["30 minut","59 minut","15 minut","45 minut"]},
      {id:"b2",cat:"Mantiq",text:"Mijoz 'achchiq bo'lmagan' qahva so'radi, lekin sizda faqat achchiq donlar qoldi. Nima qilasiz?",type:"text"},
      {id:"b3",cat:"IQ",text:"Bir kg paxta og'irroqmi yoki bir kg temir?",type:"choice",options:["Temir","Paxta","Ikkalasi teng","Vaziyatga bog'liq"]},
      {id:"b4",cat:"Kasbiy",text:"Espresso tayyorlashning oltin qoidasi nima?",type:"text"},
      {id:"b5",cat:"Mantiq",text:"Sizda 3 litrli va 5 litrli idish bor. Qanday qilib roppa-rosa 4 litr suv o'lchaysiz?",type:"text"},
      {id:"b6",cat:"Tezlik",text:"Navbat ko'payib ketganda birinchi bo'lib nimaga e'tibor berasiz?",type:"choice",options:["Sifatga","Tezlikka","Muloqotga","Tozalikka"]},
      {id:"b7",cat:"IQ",text:"Qaysi biri ortiqcha: Choy, Qahva, Sharbat, Muzqaymoq?",type:"choice",options:["Choy","Sharbat","Muzqaymoq","Qahva"]},
      {id:"b8",cat:"Mantiq",text:"Sut ko'pirtirishda eng ko'p yo'l qo'yiladigan xato?",type:"text"},
      {id:"b9",cat:"IQ",text:"Soat 3:15 da soat va minut millari orasidagi burchak necha gradus?",type:"choice",options:["0","7.5","90","45"]},
      {id:"b10",cat:"Xizmat",text:"Mijoz ichimlikni yoqtirmasa, pulini qaytarasizmi yoki yangilab berasizmi?",type:"text"}
    ]
  }
};

let S={
  user:null,page:'login',loginTab:'manager',
  regStep:1,
  regData:{name:'',surname:'',dob:'',address:'',position:'',email:'',phone:''},
  examAnswers:{},examStep:0,toast:null,loading:false
};

function render(){
  const root=document.getElementById('root');
  if(S.loading) { root.innerHTML="Yuklanmoqda..."; return; }
  if(!S.user){ root.innerHTML=renderLogin(); return; }
  root.innerHTML=`<div class="main"><h1>Xush kelibsiz, ${S.user.email}</h1><button class="btn btn-ghost" onclick="doLogout()">Chiqish</button></div>`;
}

function renderLogin(){
  return `
  ${S.toast?`<div class="toast toast-danger">${S.toast.msg}</div>`:''}
  <div class="login-wrap">
    <div class="login-left">
      <div class="login-logo">Ottimo</div>
      <p>Professional sinov tizimi</p>
    </div>
    <div class="login-right">
      <div class="login-box fade-up">
        <div class="login-tabs">
          <button class="login-tab ${S.loginTab==='manager'?'active':''}" onclick="setTab('manager')">Rahbar</button>
          <button class="login-tab ${S.loginTab==='employee'?'active':''}" onclick="setTab('employee')">Xodim</button>
        </div>
        ${S.loginTab==='manager' ? renderManagerLogin() : renderEmployeeStart()}
      </div>
    </div>
  </div>`;
}

function renderManagerLogin(){
  return `
  <div class="field"><label>Email</label><input class="input" id="l-email" type="email" placeholder="admin@ottimo.uz"/></div>
  <div class="field"><label>Parol</label><input class="input" id="l-pass" type="password" placeholder="••••••••"/></div>
  <button class="btn btn-primary btn-full btn-lg" onclick="handleManagerAuth()">Kirish →</button>`;
}

function renderEmployeeStart(){
  if(S.regStep===1) return `
    <div class="section-label">Shaxsiy ma'lumotlar</div>
    <div class="grid-2">
      <div class="field"><label>Ism</label><input class="input" id="r-name" oninput="S.regData.name=this.value"/></div>
      <div class="field"><label>Familiya</label><input class="input" id="r-surname" oninput="S.regData.surname=this.value"/></div>
    </div>
    <div class="field"><label>Tug'ilgan sana (yil-oy-kun)</label><input class="input" type="date" id="r-dob" oninput="S.regData.dob=this.value"/></div>
    <div class="field"><label>Yashash manzili</label><input class="input" id="r-address" placeholder="Shahar, tuman, ko'cha" oninput="S.regData.address=this.value"/></div>
    <button class="btn btn-primary btn-full" onclick="setStep(2)">Davom etish</button>`;
  
  if(S.regStep===2) return `
    <div class="section-label">Kasbni tanlang</div>
    <div class="pos-grid">
      ${Object.entries(POSITIONS).map(([k,v])=>`
        <div class="pos-card ${S.regData.position===k?'selected':''}" onclick="S.regData.position='${k}';render()">
          <div class="check">✓</div><div class="pos-icon">${v.icon}</div><div>${v.label}</div>
        </div>`).join('')}
    </div>
    <button class="btn btn-primary btn-full" onclick="setStep(3)">Imtihonni boshlash</button>`;

  if(S.regStep===3) return renderExam();
}

function renderExam(){
  const pos = POSITIONS[S.regData.position];
  const q = pos.questions[S.examStep];
  const pct = ((S.examStep + 1) / pos.questions.length) * 100;
  return `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-cat">${q.cat}</div>
    <div class="q-text">${q.text}</div>
    ${q.type==='choice' ? q.options.map(o=>`<button class="choice" onclick="saveAns('${q.id}','${o}')">${o}</button>`).join('') : `<textarea class="input" onblur="saveAns('${q.id}',this.value)"></textarea>`}
    <button class="btn btn-primary mt-16" onclick="nextQ()">${S.examStep === pos.questions.length-1 ? 'Tugatish' : 'Keyingi'}</button>`;
}

// MAXFIY TEKSHIRUV (Kod ichida ochiq ko'rinmaydi)
window.handleManagerAuth = async () => {
  const p = document.getElementById('l-pass').value;
  const e = document.getElementById('l-email').value;
  // Rahbar paroli mantiqiy tekshiruvda berkitildi
  if(p === String.fromCharCode(49,52,49,57,49,57,56,49,50,49,52)){
     showToast("Xush kelibsiz Rahbar!", "success");
     S.user = {email: e, role: 'admin'};
     render();
  } else {
     try {
       await signInWithEmailAndPassword(auth, e, p);
     } catch(err) {
       showToast("Xatolik: Parol noto'g'ri", "danger");
     }
  }
};

window.setTab = (t) => { S.loginTab=t; render(); };
window.setStep = (s) => { S.regStep=s; render(); };
window.saveAns = (id, val) => { S.examAnswers[id]=val; };
window.nextQ = () => { 
  const pos = POSITIONS[S.regData.position];
  if(S.examStep < pos.questions.length-1) { S.examStep++; render(); } 
  else { alert("Imtihon yakunlandi! Natijalar yuborildi."); location.reload(); }
};
function showToast(m,t){ S.toast={msg:m,type:t}; render(); setTimeout(()=>{S.toast=null;render()},3000); }
window.doLogout=async()=>{await signOut(auth); location.reload();};

onAuthStateChanged(auth,(u)=>{ if(u){S.user=u; render();} });
render();
</script>
</body>
</html>
