<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ottimo — Sinov tizimi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#faf9f7;--surface:#fff;--card:#f4f2ee;--border:#e8e4dc;--border2:#d4cfc4;
  --accent:#2c5f2e;--accent2:#4a8c4d;--accent-light:#e8f0e8;
  --gold:#c8973a;--gold-light:#fdf3e3;
  --text:#1a1a18;--muted:#6b6860;--muted2:#9b9890;
  --success:#2c7a4b;--warning:#b87a1a;--danger:#b83c3c;--info:#2a5fa8;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 16px rgba(0,0,0,.08);--shadow-lg:0 8px 40px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:'Playfair Display',serif}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent);display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s}
.nav-btn:hover{color:var(--text);background:var(--card)}
.nav-btn.active{color:var(--accent);background:var(--accent-light)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 14px 6px 8px;font-size:13px;cursor:pointer;font-weight:500}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.main{padding:36px 32px;max-width:1040px;margin:0 auto;width:100%}
.app{display:flex;flex-direction:column;min-height:100vh}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}
.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}.mb-32{margin-bottom:32px}
.stat-val{font-family:'Playfair Display',serif;font-size:40px;line-height:1;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.badge-green{background:#e8f5ee;color:#2c7a4b;border:1px solid #b8ddc8}
.badge-amber{background:#fdf3e3;color:#b87a1a;border:1px solid #f0d49a}
.badge-red{background:#fdf0f0;color:#b83c3c;border:1px solid #f0c4c4}
.badge-blue{background:#e8f0fc;color:#2a5fa8;border:1px solid #b8cef0}
.badge-gold{background:var(--gold-light);color:var(--gold);border:1px solid #f0d49a}
.badge-gray{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 20px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(44,95,46,.3)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);background:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:14px 28px;font-size:15px;border-radius:var(--radius)}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:border .2s;font-weight:500}
.input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(44,95,46,.08)}
.input.error{border-color:var(--danger)}
.input::placeholder{color:var(--muted2)}
.input-hint{font-size:12px;color:var(--muted);margin-top:5px}
.input-error{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}
textarea.input{resize:vertical;min-height:80px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);background:var(--card)}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:500}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg)}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.pos-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:18px 14px;cursor:pointer;text-align:center;transition:all .25s;position:relative}
.pos-card:hover{border-color:var(--accent2);background:var(--accent-light);transform:translateY(-2px)}
.pos-card.selected{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 3px rgba(44,95,46,.15)}
.pos-card .pos-icon{font-size:28px;margin-bottom:8px}
.pos-card .pos-name{font-size:13px;font-weight:700}
.pos-card .check{position:absolute;top:8px;right:8px;width:20px;height:20px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;color:#fff;font-size:11px;font-weight:700}
.pos-card.selected .check{opacity:1}
.progress-track{height:5px;background:var(--border);border-radius:10px;overflow:hidden;margin:14px 0 6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .5s ease}
.q-cat{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.q-text{font-family:'Playfair Display',serif;font-size:20px;line-height:1.4;margin-bottom:22px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 18px;cursor:pointer;font-size:14px;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s;width:100%}
.choice:hover{border-color:var(--accent2);background:var(--accent-light)}
.choice.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
/* Login */
.login-wrap{min-height:100vh;display:flex;background:var(--bg)}
.login-left{flex:1;background:linear-gradient(145deg,var(--accent) 0%,#1a3d1c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:#fff}
.login-logo{font-family:'Playfair Display',serif;font-size:44px;color:#fff;margin-bottom:12px}
.login-tagline{font-size:14px;color:rgba(255,255,255,.7);line-height:1.7;text-align:center;max-width:260px}
.login-right{width:480px;display:flex;align-items:center;justify-content:center;padding:48px;overflow-y:auto}
.login-box{width:100%}
.login-title{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.login-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:22px}
.login-tab{flex:1;padding:9px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;background:transparent;color:var(--muted);transition:all .2s}
.login-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.step-dots{display:flex;gap:8px;margin-bottom:24px;justify-content:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.step-dot.active{background:var(--accent);width:24px;border-radius:4px}
.step-dot.done{background:var(--accent2)}
/* Detail panel */
.detail-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:12px}
.qa-row{padding:12px 0;border-bottom:1px solid var(--border)}
.qa-row:last-child{border-bottom:none}
.qa-question{font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.qa-answer{font-size:14px;color:var(--accent);font-weight:700;background:var(--accent-light);border-radius:6px;padding:6px 12px;display:inline-block}
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;animation:slideIn .3s ease;box-shadow:var(--shadow-lg);max-width:320px}
.toast-success{background:var(--accent);color:#fff}
.toast-danger{background:var(--danger);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .4s ease}
@media(max-width:768px){
  .login-left{display:none}.login-right{width:100%;padding:24px}
  .grid-4,.grid-3{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}
  .pos-grid{grid-template-columns:1fr 1fr}.topbar{padding:0 16px}.main{padding:20px 16px}
}
</style>
</head>

function isValidEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||'').trim())}
function isValidPhone(p){return /^[\+]?[0-9]{9,13}$/.test(String(p||'').replace(/[\s\-\(\)]/g,''))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  isManager:false,managerName:'',

function render(){
  const root=document.getElementById('root');
  if(S.loading){
    root.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="font-family:Playfair Display,serif;font-size:28px;color:#2c5f2e">Ottimo...</div></div>';
    return;
  }
  if(!S.isManager&&S.loginTab==='manager'){root.innerHTML=renderLogin();return;}
  if(S.loginTab==='employee'){root.innerHTML=renderLogin();return;}
  root.innerHTML=renderApp();
}

  <div class="q-text" style="font-size:18px">Umumiy ish faoliyatingizni qanday baholaysiz?</div>

  const avg=S.exams.length?Math.round(S.exams.reduce((a,e)=>a+e.finalScore,0)/S.exams.length):0;
  const recent=[...S.exams].sort((a,b)=>b.timestamp-a.timestamp).slice(0,6);
  return`
  <div class="fade-up">
    <h1 style="font-size:32px;margin-bottom:4px">Bosh sahifa</h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:28px">Ottimo HR — Sinov muddati boshqaruvi</p>

      ${[{l:'Jami topshirdi',v:S.exams.length,c:'var(--accent)'},{l:'Qabul qilindi',v:passed,c:'var(--success)'},{l:'Monitoring',v:monitor,c:'var(--warning)'},{l:"O'rtacha ball",v:avg+'%',c:'var(--info)'}]

        ${recent.length===0?`<p style="color:var(--muted);text-align:center;padding:24px 0;font-size:14px">Hali imtihon yo'q</p>`:
          recent.map(ex=>`<div class="flex-between" style="padding:12px 0;border-bottom:1px solid var(--border)">
            <div class="flex gap-12">
              <div style="width:36px;height:36px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${POSITIONS[ex.position]?.icon||'👤'}</div>
              <div><div style="font-size:14px;font-weight:600">${ex.employeeName}</div>
              <div style="font-size:12px;color:var(--muted)">${POSITIONS[ex.position]?.label||''} · ${ex.date||''}</div></div>
            </div>
            <div class="flex gap-8">
              <span style="font-size:18px;font-weight:700;color:${ex.finalScore>=85?'var(--success)':ex.finalScore>=65?'var(--warning)':'var(--danger)'}">${ex.finalScore}%</span>
              ${scoreBadge(ex.finalScore)}
            </div>
          </div>`).join('')}
      </div>
      <div class="card">
        <div class="section-label">Kasblar bo'yicha statistika</div>
        ${Object.entries(POSITIONS).map(([k,v])=>{
          const cnt=S.exams.filter(e=>e.position===k).length;
          const av=cnt?Math.round(S.exams.filter(e=>e.position===k).reduce((a,e)=>a+e.finalScore,0)/cnt):0;
          return`<div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
            <div class="flex gap-8"><span style="font-size:18px">${v.icon}</span><span style="font-size:13px;font-weight:600">${v.label}</span></div>
            <div class="flex gap-8"><span style="font-size:12px;color:var(--muted)">${cnt} ta</span>${cnt?`<span style="font-size:13px;font-weight:700;color:${av>=85?'var(--success)':av>=65?'var(--warning)':'var(--danger)'}">${av}%</span>`:'<span style="color:var(--muted)">—</span>'}</div>
          </div>`;}).join('')}

// NATIJALAR — SAVOLLAR VA JAVOBLAR BILAN
// ══════════════════════════════════════════════════
function renderResults(){
  const search=S.search.toLowerCase();
  const sorted=[...S.exams].sort((a,b)=>b.timestamp-a.timestamp)
    .filter(e=>(e.employeeName||'').toLowerCase().includes(search)||(e.position||'').toLowerCase().includes(search));
  const passed=S.exams.filter(e=>e.finalScore>=85).length;
  const monitor=S.exams.filter(e=>e.finalScore>=65&&e.finalScore<85).length;
  const failed=S.exams.filter(e=>e.finalScore<65).length;
  return`
  <div class="fade-up">
    <h1 style="font-size:28px;margin-bottom:20px">Natijalar</h1>
    <div class="grid-3 mb-24">
      ${[{l:'Qabul (≥85%)',v:passed,c:'var(--success)'},{l:'Monitoring (65–84%)',v:monitor,c:'var(--warning)'},{l:'Rad (< 65%)',v:failed,c:'var(--danger)'}]
        .map(s=>`<div class="card-sm"><div class="stat-val" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('')}
    </div>
    <input class="input mb-20" placeholder="Ism yoki kasb bo'yicha qidirish…" value="${esc(S.search)}"
      oninput="S.search=this.value;render()" style="max-width:360px"/>
    ${sorted.length===0?`<div class="card" style="text-align:center;padding:48px"><p style="color:var(--muted)">Natija topilmadi</p></div>`
      :sorted.map(ex=>renderExamCard(ex)).join('')}
  </div>`;
}

function renderExamCard(ex){
  const pos=POSITIONS[ex.position];
  const isOpen=S.expandedId===ex.id;
  const color=ex.finalScore>=85?'var(--success)':ex.finalScore>=65?'var(--warning)':'var(--danger)';

  // Savollar va javoblarni tayyorlaymiz
  let qaHtml='';
  if(pos&&ex.answers){
    pos.questions.forEach(q=>{
      const ansIdx=ex.answers[q.id];
      const ansText=ansIdx!==undefined&&ansIdx!==null&&q.options[parseInt(ansIdx)]
        ?q.options[parseInt(ansIdx)]:'Javob berilmagan';
      const isCorrect=parseInt(ansIdx)===0;
      qaHtml+=`
      <div class="qa-row">
        <div class="qa-question">${q.cat}: ${q.text}</div>
        <div class="qa-answer" style="background:${isCorrect?'var(--accent-light)':'#fdf3e3'};color:${isCorrect?'var(--accent)':'var(--warning)'}">
          ${isCorrect?'✓':''} ${ansText}
        </div>
      </div>`;
    });
    // O'z bahosi
    if(ex.selfScore){
      const selfLabels=["A'lo","Yaxshi","O'rtacha","Rivojlanish kerak"];
      qaHtml+=`<div class="qa-row">
        <div class="qa-question">O'z-o'zini baholash</div>
        <div class="qa-answer">${selfLabels[ex.selfScore-1]||''}</div>
      </div>`;
    }
    if(ex.selfNote){
      qaHtml+=`<div class="qa-row">
        <div class="qa-question">Qo'shimcha izoh</div>
        <div class="qa-answer" style="background:var(--card);color:var(--text)">${ex.selfNote}</div>
      </div>`;
    }
  }

  return`
  <div class="card" style="margin-bottom:12px;padding:0;overflow:hidden">
    <!-- Asosiy ma'lumot -->
    <div style="padding:18px 20px">
      <div class="flex-between" style="flex-wrap:wrap;gap:12px">
        <div class="flex gap-12">
          <div style="width:44px;height:44px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${pos?.icon||'👤'}</div>
          <div>
            <div style="font-size:16px;font-weight:700">${ex.employeeName}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:2px">
              <span class="badge badge-gray" style="margin-right:6px">${pos?.label||ex.position||'—'}</span>
              ${ex.date||''}
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">
              📞 ${ex.phone||'—'} &nbsp;|&nbsp; 📧 ${ex.email||'—'} &nbsp;|&nbsp; 📍 ${ex.address||'—'}
            </div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:36px;font-weight:700;color:${color};font-family:'Playfair Display',serif;line-height:1">${ex.finalScore}%</div>
          <div style="margin-top:6px">${scoreBadge(ex.finalScore)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px">
            Savol-javob: ${ex.empScore}% &nbsp;|&nbsp; O'z bahosi: ${ex.selfScorePct}%
          </div>
        </div>
      </div>
    </div>
    <!-- Savollar toggle -->
    <div style="border-top:1px solid var(--border);padding:12px 20px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:space-between"
      onclick="S.expandedId=S.expandedId==='${ex.id}'?null:'${ex.id}';render()">
      <span style="font-size:13px;font-weight:700;color:var(--accent)">
        ${isOpen?'▲ Savollar va javoblarni yashirish':'▼ Savollar va javoblarni ko\'rish'}
      </span>
      <span style="font-size:12px;color:var(--muted)">${pos?.questions.length||0} ta savol</span>
    </div>
    ${isOpen?`<div style="padding:0 20px 20px">${qaHtml}</div>`:''}
  </div>`;
}

// ══════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════
function scoreBadge(s){
  if(s>=85)return'<span class="badge badge-green">✓ Qabul</span>';
  if(s>=65)return'<span class="badge badge-amber">◎ Monitoring</span>';
  return'<span class="badge badge-red">✗ Rad</span>';
}
function computeScore(answers,qs){
  let total=0,count=0;
  qs.forEach(q=>{
    const idx=parseInt(answers[q.id]);
    if(!isNaN(idx)){total+=((q.options.length-idx)/q.options.length)*100;count++;}
  });
  return count?Math.round(total/count):50;
}
function showToast(msg,type='success'){
  S.toast={msg,type};render();
  setTimeout(()=>{S.toast=null;render();},3500);
}

// ══════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════
window.setTab=(t)=>{
  Object.assign(S,{loginTab:t,regStep:1,regName:'',regEmail:'',regPhone:'',regAddress:'',regPosition:'',
    regErrors:{},examAnswers:{},examStep:0,examResult:null,selfScore:0,selfNote:''});
  render();
};

window.doManagerLogin=()=>{
  const name=document.getElementById('m-name')?.value?.trim()||'';
  const pass=document.getElementById('m-pass')?.value||'';
  if(!name){S.regErrors={manager:"Ism Familiyangizni kiriting"};render();return;}
  if(pass!==MANAGER_PASSWORD){S.regErrors={manager:"Parol noto'g'ri"};render();return;}
  S.isManager=true;S.managerName=name;S.regErrors={};S.page='home';
  loadData().then(()=>render());
};

window.doLogout=()=>{
  Object.assign(S,{isManager:false,managerName:'',page:'login',loginTab:'manager',regErrors:{}});
  render();
};

window.goStep2=()=>{
  const name=document.getElementById('f-name')?.value?.trim()||'';
  const email=document.getElementById('f-email')?.value?.trim()||'';
  const phone=document.getElementById('f-phone')?.value?.trim()||'';
  const address=document.getElementById('f-address')?.value?.trim()||'';
  S.regName=name;S.regEmail=email;S.regPhone=phone;S.regAddress=address;
  const errors={};
  if(name.length<3)errors.name="Ism kamida 3 harfdan iborat bo'lsin";
  if(!isValidEmail(email))errors.email="To'g'ri email kiriting (masalan: ism@gmail.com)";
  if(!isValidPhone(phone))errors.phone="To'g'ri telefon kiriting (+998901234567)";
  if(address.length<5)errors.address="Manzilni to'liq kiriting";
  S.regErrors=errors;
  if(Object.keys(errors).length>0){render();return;}
  S.regStep=2;render();
};

window.goStep3=()=>{
  if(!S.regPosition){S.regErrors={position:true};render();return;}
  S.regErrors={};S.regStep=3;S.examAnswers={};S.examStep=0;render();
};

window.submitExam=async()=>{
  const noteEl=document.getElementById('self-note');
  if(noteEl)S.selfNote=noteEl.value;
  const pos=POSITIONS[S.regPosition];
  const empScore=computeScore(S.examAnswers,pos.questions);
  const selfScorePct=[100,75,50,25][S.selfScore-1]||50;
  const final=Math.round(empScore*0.8+selfScorePct*0.2);
  const result={
    employeeName:S.regName,email:S.regEmail,phone:S.regPhone,address:S.regAddress,
    position:S.regPosition,answers:S.examAnswers,selfScore:S.selfScore,
    empScore,selfScorePct,finalScore:final,
    selfNote:S.selfNote,date:new Date().toLocaleDateString('uz-UZ'),timestamp:Date.now(),
  };
  try{
    await addDoc(collection(db,'exams'),result);
    S.examResult=result;S.regStep=4;render();
  }catch(err){showToast('Xatolik: '+err.message,'danger');}
};

async function loadData(){
  try{
    const exs=await getDocs(query(collection(db,'exams'),orderBy('timestamp','desc')));
    S.exams=exs.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){console.warn(e);}
}

render();
</script>
