<style>
:root{
  --bg:#faf9f7;
  --surface:#ffffff;
  --card:#f4f2ee;
  --border:#e8e4dc;
  --border2:#d4cfc4;
  --accent:#2c5f2e;
  --accent2:#4a8c4d;
  --accent-light:#e8f0e8;
  --gold:#c8973a;
  --gold-light:#fdf3e3;
  --text:#1a1a18;
  --muted:#6b6860;
  --muted2:#9b9890;
  --success:#2c7a4b;
  --warning:#b87a1a;
  --danger:#b83c3c;
  --info:#2a5fa8;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 2px 16px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,.serif{font-family:'Playfair Display',serif}

/* ── TOPBAR ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent);letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%;display:inline-block}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s;letter-spacing:0.3px}
.nav-btn:hover{color:var(--text);background:var(--card)}
.nav-btn.active{color:var(--accent);background:var(--accent-light)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 14px 6px 8px;font-size:13px;cursor:pointer;font-weight:500;transition:all .2s}
.user-chip:hover{border-color:var(--border2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}

/* ── MAIN ── */
.main{flex:1;padding:36px 32px;max-width:1000px;margin:0 auto;width:100%}
.app{display:flex;flex-direction:column;min-height:100vh}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,0.05)}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}.mb-32{margin-bottom:32px}

/* ── STAT ── */
.stat-val{font-family:'Playfair Display',serif;font-size:40px;line-height:1;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.03em}
.badge-green{background:#e8f5ee;color:#2c7a4b;border:1px solid #b8ddc8}
.badge-amber{background:#fdf3e3;color:#b87a1a;border:1px solid #f0d49a}
.badge-red{background:#fdf0f0;color:#b83c3c;border:1px solid #f0c4c4}
.badge-blue{background:#e8f0fc;color:#2a5fa8;border:1px solid #b8cef0}
.badge-gold{background:var(--gold-light);color:var(--gold);border:1px solid #f0d49a}
.badge-gray{background:var(--card);color:var(--muted);border:1px solid var(--border)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 20px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .2s;letter-spacing:0.3px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(44,95,46,0.3)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);background:var(--card)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#b8832a;transform:translateY(-1px)}
.btn-danger{background:#fdf0f0;color:var(--danger);border:1px solid #f0c4c4}
.btn-danger:hover{background:#f8dede}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:14px 28px;font-size:15px;border-radius:var(--radius)}

/* ── INPUTS ── */
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:all .2s;font-weight:500}
.input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(44,95,46,0.08)}
.input.error{border-color:var(--danger);background:#fdf8f8}
.input::placeholder{color:var(--muted2)}
.input-hint{font-size:12px;color:var(--muted);margin-top:5px}
.input-error{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:90px}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);background:var(--card)}
td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:500}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg)}

/* ── POSITION CARDS ── */
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.pos-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:20px 16px;cursor:pointer;text-align:center;transition:all .25s;position:relative}
.pos-card:hover{border-color:var(--accent2);background:var(--accent-light);transform:translateY(-2px);box-shadow:var(--shadow)}
.pos-card.selected{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 3px rgba(44,95,46,0.15)}
.pos-card .pos-icon{font-size:32px;margin-bottom:10px}
.pos-card .pos-name{font-size:14px;font-weight:700;color:var(--text)}
.pos-card .pos-sub{font-size:12px;color:var(--muted);margin-top:3px}
.pos-card .check{position:absolute;top:10px;right:10px;width:20px;height:20px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.pos-card.selected .check{opacity:1}

/* ── EXAM ── */
.exam-wrap{max-width:700px;margin:0 auto}
.progress-track{height:5px;background:var(--border);border-radius:10px;overflow:hidden;margin:14px 0 6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .5s ease}
.q-num{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.q-cat{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.q-text{font-family:'Playfair Display',serif;font-size:24px;line-height:1.4;color:var(--text);margin-bottom:28px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 18px;cursor:pointer;font-size:14px;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s}
.choice:hover{border-color:var(--accent2);background:var(--accent-light)}
.choice.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

/* ── STARS ── */
.stars{display:flex;gap:6px;margin-bottom:8px}
.star{font-size:32px;cursor:pointer;color:var(--border2);transition:all .15s;user-select:none;line-height:1}
.star.on{color:var(--gold)}
.star:hover{transform:scale(1.2)}
.star-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;max-width:200px}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;background:var(--bg)}
.login-left{flex:1;background:linear-gradient(145deg,var(--accent) 0%,#1a3d1c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:#fff;position:relative;overflow:hidden}
.login-left::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.login-logo{font-family:'Playfair Display',serif;font-size:42px;color:#fff;margin-bottom:12px}
.login-tagline{font-size:15px;color:rgba(255,255,255,0.7);line-height:1.6;text-align:center;max-width:280px}
.login-right{width:480px;display:flex;align-items:center;justify-content:center;padding:48px}
.login-box{width:100%}
.login-title{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.login-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:28px}
.login-tab{flex:1;padding:9px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;background:transparent;color:var(--muted);transition:all .2s;letter-spacing:.3px}
.login-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.1)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:24px}

/* ── REGISTER STEPS ── */
.step-dots{display:flex;gap:8px;margin-bottom:32px;justify-content:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.step-dot.active{background:var(--accent);width:24px;border-radius:4px}
.step-dot.done{background:var(--accent2)}

/* ── RESULT ── */
.result-big{font-family:'Playfair Display',serif;font-size:80px;line-height:1;margin:16px 0}
.result-icon{font-size:56px;line-height:1}

/* ── TOAST ── */
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;animation:slideIn .3s ease;box-shadow:var(--shadow-lg);max-width:320px}
.toast-success{background:var(--accent);color:#fff}
.toast-danger{background:var(--danger);color:#fff}
.toast-info{background:var(--info);color:#fff}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:20px 0}

@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .4s ease}

@media(max-width:768px){
  .login-left{display:none}
  .login-right{width:100%;padding:32px 24px}
  .grid-4,.grid-3{grid-template-columns:1fr 1fr}
  .grid-2{grid-template-columns:1fr}
  .pos-grid{grid-template-columns:1fr 1fr}
  .topbar{padding:0 16px}
  .main{padding:20px 16px}
}
</style>
</head>

function renderManagerLogin(){
  return`
  <div class="field"><label>Email</label><input class="input" id="l-email" type="email" placeholder="rahbar@ottimo.uz"/></div>
  <div class="field"><label>Parol</label><input class="input" id="l-pass" type="password" placeholder="••••••••"/></div>

function renderEmployeeStart(){
  // Employee registration flow
  if(S.regStep===1) return renderRegStep1();
  if(S.regStep===2) return renderRegStep2();
  if(S.regStep===3) return renderExamInline();
  if(S.regStep===4) return renderExamResultInline();
  return renderRegStep1();
}

  <div class="field">

    <label>Email manzil *</label>

function renderRegStep2(){
  return`
  <div class="step-dots">
    <div class="step-dot done"></div>
    <div class="step-dot active"></div>
    <div class="step-dot"></div>
  </div>
  <div class="section-label">Kasbingizni tanlang</div>
  ${S.regErrors.position?`<div class="input-error mb-16">⚠ Kasbni tanlang</div>`:''}
  <div class="pos-grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
    ${Object.entries(POSITIONS).map(([k,v])=>`
    <div class="pos-card ${S.regData.position===k?'selected':''}" onclick="updateReg('position','${k}')">
      <div class="check">✓</div>
      <div class="pos-icon">${v.icon}</div>
      <div class="pos-name">${v.label}</div>

  </div>

    <button class="btn btn-ghost" onclick="setState({regStep:1})">← Orqaga</button>
    <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="validateStep2()">Imtihonni boshlash →</button>
  </div>`;
}

function renderExamInline(){
  const pos=POSITIONS[S.regData.position];
  const qs=pos.questions;
  const step=S.examStep;
  const isManager=step>=qs.length;
  const pct=Math.round((step/(qs.length+1))*100);

  return`
  <div class="step-dots">
    <div class="step-dot done"></div>
    <div class="step-dot done"></div>
    <div class="step-dot active"></div>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:20px">${isManager?'Oxirgi qadam':'Savol '+(step+1)+' / '+qs.length}</div>

  ${isManager?`
  <div class="q-cat">Umumiy baholash</div>
  <div class="q-text" style="font-size:20px">O'zingizni umumiy baholang</div>
  <div class="stars mb-8">${[1,2,3,4,5].map(n=>`<span class="star ${n<=S.managerScore?'on':''}" onclick="setState({managerScore:${n}})">★</span>`).join('')}</div>
  <div class="star-labels"><span>Yomon</span><span>A'lo</span></div>
  <div class="field" style="margin-top:16px"><label>Qo'shimcha izoh</label>
    <textarea class="input" id="self-note" rows="3" placeholder="O'zingiz haqida qo'shimcha ma'lumot...">${S.managerNote}</textarea>
  </div>
  <div class="flex gap-8" style="margin-top:16px">
    <button class="btn btn-ghost" onclick="setState({examStep:${qs.length-1}})">← Orqaga</button>
    <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="submitEmployeeExam()">Yuborish ✓</button>
  </div>
  `:`
  ${renderQuestion(qs[step])}
  <div class="flex gap-8" style="margin-top:24px">
    <button class="btn btn-ghost" ${step===0?'disabled':''} onclick="prevStep()">← Oldingi</button>
    <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="nextStep()">
      ${step===qs.length-1?'Yakunlash →':'Keyingi →'}
    </button>
  </div>`}`;
}

function renderQuestion(q){
  return`
  <div class="q-cat">${q.cat}</div>
  <div class="q-text">${q.text}</div>
  ${q.type==='rating'?`
    <div class="stars">${[1,2,3,4,5].map(n=>`<span class="star ${n<=(S.examAnswers[q.id]||0)?'on':''}" onclick="setAns('${q.id}',${n})">★</span>`).join('')}</div>
    <div class="star-labels"><span>1 — Yomon</span><span>5 — A'lo</span></div>
  `:q.type==='text'?`
    <textarea class="input" id="txt-${q.id}" rows="4" placeholder="Javobingizni yozing...">${S.examAnswers[q.id]||''}</textarea>
  `:`
    <div class="choices">
      ${(q.options||[]).map(o=>`<button class="choice ${S.examAnswers[q.id]===o?'selected':''}" onclick="setAns('${q.id}','${encodeURIComponent(o)}')">${o}</button>`).join('')}
    </div>`}`;
}

function renderExamResultInline(){
  const r=S.examResult;
  if(!r)return'';
  const color=r.finalScore>=85?'var(--success)':r.finalScore>=65?'var(--warning)':'var(--danger)';
  const icon=r.finalScore>=85?'🏆':r.finalScore>=65?'📊':'📋';
  const msg=r.finalScore>=85?'Tabriklaymiz! Natijalaringiz rahbarga yuborildi.'
    :r.finalScore>=65?'Yaxshi natija! Ma\'lumotlaringiz rahbarga yuborildi.'
    :'Natijalaringiz rahbarga yuborildi. Rahbar siz bilan bog\'lanadi.';
  return`
  <div style="text-align:center;padding:20px 0">
    <div style="font-size:52px;margin-bottom:12px">${icon}</div>
    <div style="font-family:'Playfair Display',serif;font-size:64px;color:${color};line-height:1">${r.finalScore}%</div>
    <div style="margin:12px 0">${scoreBadge(r.finalScore)}</div>
    <p style="font-size:14px;color:var(--muted);margin:16px 0;line-height:1.6">${msg}</p>
    <div class="grid-2" style="margin-top:20px;text-align:left">
      <div class="card-sm"><div style="font-size:11px;color:var(--muted);font-weight:600">Savol javoblar</div><div style="font-size:22px;font-weight:700;margin-top:4px">${r.empScore}%</div></div>
      <div class="card-sm"><div style="font-size:11px;color:var(--muted);font-weight:600">O'z bahosi</div><div style="font-size:22px;font-weight:700;color:var(--gold);margin-top:4px">${r.selfScore}%</div></div>
    </div>
  </div>`;
}

function renderApp(){
  const pages=['home','employees','results'];
  const labels={home:'Bosh sahifa',employees:'Hodimlar',results:'Natijalar'};
  let content='';
  if(S.page==='home')content=renderHome();
  else if(S.page==='employees')content=renderEmployees();
  else if(S.page==='results')content=renderResults();

  return`
  ${S.toast?`<div class="toast toast-${S.toast.type}">${S.toast.msg}</div>`:''}
  <div class="app">
    <div class="topbar">
      <div class="logo"><div class="logo-dot"></div>Ottimo</div>
      <nav class="nav">
        ${pages.map(p=>`<button class="nav-btn ${S.page===p?'active':''}" onclick="goPage('${p}')">${labels[p]}</button>`).join('')}
      </nav>
      <div class="user-chip" onclick="doLogout()">
        <div class="avatar">${(S.userData?.name||S.user.email)[0].toUpperCase()}</div>
        <span style="font-size:13px;font-weight:600">${S.userData?.name||'Rahbar'}</span>
        <span style="color:var(--muted);font-size:12px">↗</span>
      </div>
    </div>
    <div class="main">
      ${content}
      ${S.showAddEmp?renderAddEmpModal():''}
    </div>
  </div>`;
}

    <div class="grid-4 mb-24">

        {l:'Hodimlar',v:S.employees.length,c:'var(--accent)'},

            <div class="flex gap-12">
              <div style="width:36px;height:36px;border-radius:50%;background:${POSITIONS[ex.position]?.color||'var(--accent)'}22;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${POSITIONS[ex.position]?.icon||'👤'}</div>

// ══════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════
function scoreBadge(s){
  if(s>=85)return`<span class="badge badge-green">✓ Qabul</span>`;
  if(s>=65)return`<span class="badge badge-amber">◎ Monitoring</span>`;
  return`<span class="badge badge-red">✗ Rad</span>`;
}
function daysLeft(d){
  const end=new Date(new Date(d).getTime()+30*24*60*60*1000);
  return Math.ceil((end-new Date())/(1000*60*60*24));
}
function computeScore(answers,qs){
  let total=0,count=0;
  qs.forEach(q=>{
    if(q.type==='rating'){total+=((answers[q.id]||3)/5)*100;count++;}
    else if(q.type==='choice'){
      const idx=(q.options||[]).indexOf(decodeURIComponent(answers[q.id]||''));
      if(idx>=0){total+=((q.options.length-idx)/q.options.length)*100;count++;}
    }
  });
  return count?Math.round(total/count):50;
}

// GLOBAL ACTIONS
// ══════════════════════════════════════════════════
window.setState=(patch)=>{Object.assign(S,patch);render()};
window.goPage=(p)=>setState({page:p});
window.setTab=(t)=>setState({loginTab:t,regStep:1,regData:{name:'',email:'',phone:'',address:'',position:''},regErrors:{},examAnswers:{},examStep:0,examDone:false,examResult:null});
window.updateReg=(k,v)=>{S.regData[k]=v;S.regErrors[k]='';render()};
window.setAns=(id,val)=>{S.examAnswers[id]=val;render()};
window.prevStep=()=>setState({examStep:Math.max(0,S.examStep-1)});
window.nextStep=()=>{
  const qs=POSITIONS[S.regData.position].questions;
  const q=qs[S.examStep];
  if(q&&q.type==='text'){const el=document.getElementById('txt-'+q.id);if(el)S.examAnswers[q.id]=el.value;}
  setState({examStep:S.examStep+1});
};

window.showToast=(msg,type='success',dur=3500)=>{
  setState({toast:{msg,type}});
  setTimeout(()=>setState({toast:null}),dur);
};

window.validateStep1=()=>{
  const d=S.regData;
  const errors={};
  if(!d.name||d.name.trim().length<3)errors.name="Ism kamida 3 harfdan iborat bo'lishi kerak";
  if(!d.email||!isValidEmail(d.email))errors.email="To'g'ri email kiriting (masalan: ism@gmail.com)";
  if(!d.phone||!isValidPhone(d.phone))errors.phone="To'g'ri telefon raqam kiriting";
  if(!d.address||d.address.trim().length<5)errors.address="Manzilni to'liq kiriting";
  if(Object.keys(errors).length>0){setState({regErrors:errors});return;}
  setState({regStep:2,regErrors:{}});
};

window.validateStep2=()=>{
  if(!S.regData.position){setState({regErrors:{position:true}});return;}
  setState({regStep:3,regErrors:{},examAnswers:{},examStep:0});
};

window.submitEmployeeExam=async()=>{
  const el=document.getElementById('self-note');
  if(el)S.managerNote=el.value;
  const pos=POSITIONS[S.regData.position];
  const empScore=computeScore(S.examAnswers,pos.questions);
  const selfScore=Math.round((S.managerScore/5)*100);
  const final=Math.round(empScore*0.7+selfScore*0.3);
  const result={
    employeeName:S.regData.name,
    email:S.regData.email,
    phone:S.regData.phone,
    address:S.regData.address,
    position:S.regData.position,
    answers:S.examAnswers,
    empScore,selfScore,finalScore:final,
    selfNote:S.managerNote,
    date:new Date().toLocaleDateString('uz-UZ'),
    timestamp:Date.now(),
  };
  try{
    await addDoc(collection(db,'exams'),result);
    // Also add to employees
    await addDoc(collection(db,'employees'),{
      name:S.regData.name,email:S.regData.email,
      phone:S.regData.phone,address:S.regData.address,
      position:S.regData.position,startDate:new Date().toISOString().split('T')[0],
      status:final>=85?'passed':final>=65?'monitor':'failed',
      lastScore:final,createdAt:serverTimestamp(),
    });
    setState({regStep:4,examResult:result});
  }catch(err){showToast('Xatolik: '+err.message,'danger');}
};

// AUTH
window.doLogin=async()=>{
  const email=document.getElementById('l-email')?.value?.trim();
  const pass=document.getElementById('l-pass')?.value;
  const name=document.getElementById('l-name')?.value?.trim();
  if(!email||!pass)return showToast('Email va parol kiriting','danger');
  if(!isValidEmail(email))return showToast("To'g'ri email kiriting: ism@gmail.com",'danger');
  try{
    let cred;
    try{cred=await signInWithEmailAndPassword(auth,email,pass);}
    catch{
      if(!name)return showToast("Yangi hisob: ismingizni kiriting",'danger');
      cred=await createUserWithEmailAndPassword(auth,email,pass);
      await setDoc(doc(db,'users',cred.user.uid),{name,email,role:'manager',createdAt:serverTimestamp()});
    }
  }catch(err){
    const msgs={'auth/wrong-password':"Parol noto'g'ri",'auth/user-not-found':'Foydalanuvchi topilmadi','auth/invalid-credential':"Email yoki parol noto'g'ri"};
    showToast(msgs[err.code]||'Xatolik: '+err.message,'danger');
  }
};
window.doLogout=async()=>{await signOut(auth);};

// LOAD DATA
async function loadData(){
  try{
    const[emps,exs]=await Promise.all([
      getDocs(collection(db,'employees')),
      getDocs(query(collection(db,'exams'),orderBy('timestamp','desc'))),
    ]);
    S.employees=emps.docs.map(d=>({id:d.id,...d.data()}));
    S.exams=exs.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){console.warn(e);}
}

// AUTH STATE
onAuthStateChanged(auth,async(user)=>{
  if(user){
    const ud=await getDoc(doc(db,'users',user.uid));
    S.user=user;S.userData=ud.exists()?ud.data():null;
    S.userRole=S.userData?.role||'manager';
    S.page='home';
    await loadData();
  }else{
    S.user=null;S.userData=null;S.userRole=null;
    S.page='login';S.loginTab='manager';
  }
  S.loading=false;
  render();
});

function attachEvents(){}
render();
</script>
