<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ottimo — Sinov tizimi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#faf9f7;--surface:#fff;--card:#f4f2ee;--border:#e8e4dc;
  --accent:#2c5f2e;--accent2:#4a8c4d;--accent-light:#e8f0e8;
  --gold:#c8973a;--gold-light:#fdf3e3;
  --text:#1a1a18;--muted:#6b6860;--muted2:#9b9890;
  --success:#2c7a4b;--warning:#b87a1a;--danger:#b83c3c;--info:#2a5fa8;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 16px rgba(0,0,0,.08);--shadow-lg:0 8px 40px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:'Playfair Display',serif}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent);display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s}
.nav-btn:hover{color:var(--text);background:var(--card)}
.nav-btn.active{color:var(--accent);background:var(--accent-light)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 14px 6px 8px;font-size:13px;cursor:pointer;font-weight:500}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.main{padding:36px 32px;max-width:1040px;margin:0 auto;width:100%}
.app{display:flex;flex-direction:column;min-height:100vh}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}
.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}
.stat-val{font-family:'Playfair Display',serif;font-size:40px;line-height:1;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.badge-green{background:#e8f5ee;color:#2c7a4b;border:1px solid #b8ddc8}
.badge-amber{background:#fdf3e3;color:#b87a1a;border:1px solid #f0d49a}
.badge-red{background:#fdf0f0;color:#b83c3c;border:1px solid #f0c4c4}
.badge-gray{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 20px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);background:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:14px 28px;font-size:15px;border-radius:var(--radius)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:border .2s;font-weight:500}
.input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(44,95,46,.08)}
.input.error{border-color:var(--danger)}
.input::placeholder{color:var(--muted2)}
.input-hint{font-size:12px;color:var(--muted);margin-top:4px}
.input-error{font-size:12px;color:var(--danger);margin-top:4px;font-weight:600}
/* Kasb kartochkalar */
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.pos-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:20px 14px;cursor:pointer;text-align:center;transition:all .2s;position:relative}
.pos-card:hover{border-color:var(--accent2);background:var(--accent-light);transform:translateY(-2px)}
.pos-card.selected{border-color:var(--accent);background:var(--accent-light)}
.pos-card .pos-icon{font-size:30px;margin-bottom:8px}
.pos-card .pos-name{font-size:13px;font-weight:700}
/* Progress */
.progress-track{height:5px;background:var(--border);border-radius:10px;overflow:hidden;margin:14px 0 6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .5s ease}
.q-cat{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.q-text{font-family:'Playfair Display',serif;font-size:20px;line-height:1.4;margin-bottom:20px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;cursor:pointer;font-size:14px;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s;width:100%}
.choice:hover{border-color:var(--accent2);background:var(--accent-light)}
.choice.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
/* Login */
.login-wrap{min-height:100vh;display:flex;background:var(--bg)}
.login-left{flex:1;background:linear-gradient(145deg,var(--accent) 0%,#1a3d1c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:#fff}
.login-logo{font-family:'Playfair Display',serif;font-size:44px;color:#fff;margin-bottom:12px}
.login-tagline{font-size:14px;color:rgba(255,255,255,.7);line-height:1.7;text-align:center;max-width:260px}
.login-right{width:480px;display:flex;align-items:flex-start;justify-content:center;padding:40px;overflow-y:auto;max-height:100vh}
.login-box{width:100%;padding-top:20px}
.login-title{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.login-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px}
.login-tab{flex:1;padding:9px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;background:transparent;color:var(--muted);transition:all .2s}
.login-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.step-dots{display:flex;gap:8px;margin-bottom:20px;justify-content:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.step-dot.active{background:var(--accent);width:24px;border-radius:4px}
.step-dot.done{background:var(--accent2)}
/* Natija kartochka */
.exam-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.exam-card-header{padding:18px 22px;cursor:pointer;transition:background .2s}
.exam-card-header:hover{background:var(--card)}
.exam-card-body{padding:0 22px 20px;border-top:1px solid var(--border)}
.qa-item{padding:14px 0;border-bottom:1px solid var(--border)}
.qa-item:last-child{border-bottom:none}
.qa-num{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.qa-question{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.4}
.qa-options{display:flex;flex-direction:column;gap:6px}
.qa-option{font-size:13px;padding:8px 12px;border-radius:8px;font-weight:500;border:1px solid var(--border)}
.qa-option.chosen{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:700}
.qa-option.not-chosen{background:var(--bg);color:var(--muted)}
/* Toast */
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;animation:slideIn .3s ease;box-shadow:var(--shadow-lg);max-width:320px}
.toast-success{background:var(--accent);color:#fff}
.toast-danger{background:var(--danger);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .4s ease}
@media(max-width:768px){
  .login-left{display:none}.login-right{width:100%;padding:24px;max-height:none}
  .grid-3{grid-template-columns:1fr 1fr}
  .pos-grid{grid-template-columns:1fr 1fr}.topbar{padding:0 16px}.main{padding:20px 16px}
}
</style>
</head>

function isValidEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||'').trim())}
function isValidPhone(p){return /^[\+]?[0-9]{9,13}$/.test(String(p||'').replace(/[\s\-\(\)]/g,''))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderExamCard(ex){
  const pos=POSITIONS[ex.position];
  const isOpen=S.expandedId===ex.id;
  const color=ex.finalScore>=85?'var(--success)':ex.finalScore>=65?'var(--warning)':'var(--danger)';

  let qaHtml='';
  if(isOpen && pos){
    const answers=ex.answers||{};
    pos.questions.forEach((q,i)=>{
      const idx=answers[q.id];
      const ansText=(idx!==undefined && idx!==null && idx!=='' && q.options[parseInt(idx)])
        ? q.options[parseInt(idx)]
        : 'Javob berilmagan';
      qaHtml+=`
      <div style="padding:12px 0;border-bottom:1px solid var(--border)">
        <div style="font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">${q.cat}</div>
        <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px">${i+1}. ${q.text}</div>
        <div style="background:var(--accent-light);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--accent)">✓ ${ansText}</div>
      </div>`;
    });
    if(ex.selfNote){
      qaHtml+=`<div style="padding:12px 0">
        <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px">Izoh</div>
        <div style="background:var(--card);border-radius:8px;padding:8px 14px;font-size:13px">${ex.selfNote}</div>
      </div>`;
    }
  }

  return`
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)">
    <div style="padding:18px 20px;cursor:pointer" onclick="S.expandedId=S.expandedId==='${ex.id}'?null:'${ex.id}';render()">
      <div class="flex-between" style="flex-wrap:wrap;gap:12px">
        <div class="flex gap-12">
          <div style="width:44px;height:44px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${pos?.icon||'👤'}</div>
          <div>
            <div style="font-size:16px;font-weight:700">${ex.employeeName}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:2px">
              <span class="badge badge-gray" style="margin-right:6px">${pos?.label||ex.position||'—'}</span>${ex.date||''}
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">
              📞 ${ex.phone||'—'} &nbsp;·&nbsp; 📧 ${ex.email||'—'} &nbsp;·&nbsp; 📍 ${ex.address||'—'}
            </div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:36px;font-weight:700;color:${color};font-family:'Playfair Display',serif;line-height:1">${ex.finalScore}%</div>
          <div style="margin-top:6px">${scoreBadge(ex.finalScore)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">Ball: ${ex.empScore}%</div>
        </div>
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:13px;font-weight:700;color:var(--accent)">${isOpen?'▲ Yopish':'▼ Savollar va javoblarni ko\'rish'}</span>
        <span style="font-size:12px;color:var(--muted)">${pos?.questions?.length||0} ta savol</span>
      </div>
    </div>
    ${isOpen?`<div style="padding:0 20px 16px;border-top:1px solid var(--border)">${qaHtml}</div>`:''}
  </div>`;
}

function scoreBadge(s){
  if(s>=85)return'<span class="badge badge-green">✓ Qabul</span>';
  if(s>=65)return'<span class="badge badge-amber">◎ Monitoring</span>';
  return'<span class="badge badge-red">✗ Rad</span>';
}
function computeScore(answers,qs){
  let total=0,count=0;
  qs.forEach(q=>{
    const idx=answers[q.id];
    if(idx!==undefined&&idx!==null){
      total+=((q.options.length-Number(idx))/q.options.length)*100;
      count++;
    }
  });
  return count?Math.round(total/count):0;
}
function showToast(msg,type='success'){
  S.toast={msg,type};render();
  setTimeout(()=>{S.toast=null;render();},3000);
}

window.pickPos=(k)=>{S.regPosition=k;render();};
window.pickAns=function(id,idx){S.examAnswers[id]=String(idx);render();};
window.setTab=(t)=>{
  Object.assign(S,{loginTab:t,regStep:1,regName:'',regEmail:'',regPhone:'',regBirth:'',regAddress:'',
    regPosition:'',regErrors:{},examAnswers:{},examStep:0,examResult:null});
  render();
};

window.doMgrLogin=()=>{
  const name=(document.getElementById('m-name')?.value||'').trim();
  const pass=(document.getElementById('m-pass')?.value||'');
  if(!name){S.regErrors={mgr:'Ism Familiyangizni kiriting'};render();return;}
  if(pass!==MANAGER_PASSWORD){S.regErrors={mgr:"Parol noto'g'ri"};render();return;}
  S.isManager=true;S.managerName=name;S.regErrors={};
  loadData().then(()=>render());
};

window.doLogout=()=>{
  Object.assign(S,{isManager:false,managerName:'',regErrors:{},loginTab:'manager'});
  render();
};

window.goStep2=()=>{
  const name=(document.getElementById('f-name')?.value||'').trim();
  const email=(document.getElementById('f-email')?.value||'').trim();
  const phone=(document.getElementById('f-phone')?.value||'').trim();
  const birth=(document.getElementById('f-birth')?.value||'').trim();
  const address=(document.getElementById('f-address')?.value||'').trim();
  S.regName=name;S.regEmail=email;S.regPhone=phone;S.regBirth=birth;S.regAddress=address;
  const err={};
  if(name.length<3)err.name="Ism kamida 3 harfdan iborat bo'lsin";
  if(!isValidEmail(email))err.email="To'g'ri email kiriting (masalan: ism@gmail.com)";
  if(!isValidPhone(phone))err.phone="To'g'ri telefon kiriting (+998901234567)";
  if(!birth)err.birth="Tug'ilgan sanani kiriting";
  if(address.length<5)err.address="Manzilni to'liq kiriting";
  S.regErrors=err;
  if(Object.keys(err).length){render();return;}
  S.regStep=2;render();
};

window.goStep3=()=>{
  if(!S.regPosition){S.regErrors={pos:true};render();return;}
  S.regErrors={};S.regStep=3;S.examAnswers={};S.examStep=0;render();
};

window.nextQ=()=>{
  const qs=POSITIONS[S.regPosition].questions;
  if(S.examStep<qs.length-1){S.examStep++;render();return;}
  submitExam();
};

async function submitExam(){
  const pos=POSITIONS[S.regPosition];
  const score=computeScore(S.examAnswers,pos.questions);
  const result={
    name:S.regName,email:S.regEmail,phone:S.regPhone,
    birth:S.regBirth,address:S.regAddress,
    position:S.regPosition,
    answers:S.examAnswers,
    score,
    date:new Date().toLocaleDateString('uz-UZ'),
    timestamp:Date.now(),
  };
  try{
    await addDoc(collection(db,'exams'),result);
    S.examResult=result;S.regStep=4;render();
  }catch(err){showToast('Xatolik: '+err.message,'danger');}
}

async function loadData(){
  try{
    const snap=await getDocs(query(collection(db,'exams'),orderBy('timestamp','desc')));
    S.exams=snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){console.warn(e);}
}

render();
</script>
</body>
