<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f8f7f4;--surface:#fff;--card:#f2f0ec;--border:#e5e1d8;
  --accent:#2c5f2e;--accent2:#3d7a40;--accent-light:#eaf2ea;
  --gold:#c8973a;--text:#1a1a18;--muted:#6b6860;--muted2:#a09d97;
  --success:#2c7a4b;--warn:#b87a1a;--danger:#b83c3c;
  --r:12px;--r2:8px;--sh:0 2px 12px rgba(0,0,0,.07);
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.logo{font-family:'Playfair Display',serif;font-size:20px;color:var(--accent)}
.nav button{background:none;border:none;padding:7px 14px;border-radius:var(--r2);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent);background:var(--accent-light)}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600;cursor:pointer}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* MAIN */
.main{max-width:960px;margin:0 auto;padding:32px 24px}
/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.csm{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.bg{background:#e8f5ee;color:#2c7a4b;border:1px solid #b8ddc8}
.ba{background:#fdf3e3;color:#b87a1a;border:1px solid #f0d49a}
.br{background:#fdf0f0;color:#b83c3c;border:1px solid #f0c4c4}
.bb{background:#e8f0fc;color:#2a5fa8;border:1px solid #b8cef0}
.bgold{background:#fdf3e3;color:var(--gold);border:1px solid #f0d49a}
.bgray{background:var(--card);color:var(--muted);border:1px solid var(--border)}
/* BTNS */
.btn{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:var(--r2);padding:10px 18px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .18s}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent2)}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-g:hover{color:var(--text);background:var(--card)}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:13px 24px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* INPUTS */
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r2);padding:11px 13px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;font-weight:500;outline:none;transition:border .18s}
.inp:focus{border-color:var(--accent);background:var(--surface)}
.inp.err{border-color:var(--danger)}
.inp::placeholder{color:var(--muted2)}
.hint{font-size:11px;color:var(--muted);margin-top:3px}
.errtxt{font-size:11px;color:var(--danger);font-weight:700;margin-top:3px}
/* LOGIN */
.lw{min-height:100vh;display:flex}
.ll{width:340px;background:linear-gradient(150deg,var(--accent),#1a3d1c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 36px;color:#fff;flex-shrink:0}
.ll-logo{font-family:'Playfair Display',serif;font-size:40px;margin-bottom:10px}
.ll-tag{font-size:13px;color:rgba(255,255,255,.7);text-align:center;line-height:1.6}
.lr{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px;overflow-y:auto}
.lbox{width:100%;max-width:400px;padding-top:16px}
.ltabs{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:3px;margin-bottom:20px}
.ltab{flex:1;padding:8px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;background:transparent;color:var(--muted)}
.ltab.on{background:var(--surface);color:var(--accent)}
/* STEPS */
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.dot.on{background:var(--accent);width:22px;border-radius:4px}
.dot.dn{background:var(--accent2)}
/* PROGRESS */
.pbar{height:4px;background:var(--border);border-radius:10px;overflow:hidden;margin:12px 0 5px}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .4s}
/* KASB */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.pc{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:16px 12px;cursor:pointer;text-align:center;transition:all .2s;position:relative}
.pc:hover{border-color:var(--accent2);background:var(--accent-light)}
.pc.sel{border-color:var(--accent);background:var(--accent-light)}
.pc .ck{position:absolute;top:7px;right:7px;width:18px;height:18px;background:var(--accent);border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:0}
.pc.sel .ck{opacity:1}
/* SAVOL */
.qcat{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
.qtxt{font-family:'Playfair Display',serif;font-size:19px;line-height:1.45;margin-bottom:18px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r2);padding:11px 15px;cursor:pointer;font-size:14px;font-family:'Nunito',sans-serif;font-weight:600;text-align:left;width:100%;transition:all .18s;color:var(--text)}
.ch:hover{border-color:var(--accent2);background:var(--accent-light)}
.ch.sel{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
/* RESULT CARD */
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.rcard-head{padding:16px 18px;cursor:pointer}
.rcard-body{padding:0 18px 16px;border-top:1px solid var(--border)}
.qa-item{padding:10px 0;border-bottom:1px solid var(--border)}
.qa-item:last-child{border-bottom:none}
.qa-cat{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.qa-q{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.qa-a{background:var(--accent-light);border-radius:6px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--accent);display:inline-block}
/* STAT */
.sv{font-family:'Playfair Display',serif;font-size:38px;line-height:1;margin-bottom:3px}
.sl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* TABLE */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:11px 15px;text-align:left;border-bottom:1px solid var(--border);background:var(--card)}
td{padding:12px 15px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg)}
/* TOAST */
.toast{position:fixed;top:18px;right:18px;z-index:999;padding:12px 18px;border-radius:var(--r2);font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.15);max-width:300px}
.ts{background:var(--accent);color:#fff}
.td{background:var(--danger);color:#fff}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .35s ease}
@media(max-width:640px){
  .ll{display:none}.lr{padding:20px 16px}
  .g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
  .topbar{padding:0 14px}.main{padding:20px 14px}
}
</style>

// ── HELPERS ──
function vEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((e||'').trim())}
function vPhone(p){return /^\+?[0-9]{9,13}$/.test((p||'').replace(/[\s\-\(\)]/g,''))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sbadge(s){
  if(s>=85)return '<span class="badge bg">✓ Qabul</span>';
  if(s>=65)return '<span class="badge ba">◎ Monitoring</span>';
  return '<span class="badge br">✗ Rad</span>';
}
function score(ans,qs){
  let t=0,c=0;
  qs.forEach(function(q){
    var idx=parseInt(ans[q.id]);
    if(!isNaN(idx)&&idx>=0){t+=((q.o.length-idx)/q.o.length)*100;c++;}
  });
  return c?Math.round(t/c):50;
}

    +'</div></div>';
  var body=open?'<div class="rcard-body">'+qa+'</div>':'';
  return '<div class="rcard">'+head+body+'</div>';
}

// ── ACTIONS ──
window.ST=function(t){
  S.tab=t;S.step=1;S.name='';S.email='';S.phone='';S.bdate='';S.address='';S.pos='';
  S.errs={};S.ans={};S.qstep=0;S.result=null;S.mgr=false;
  R();
};
window.SP=function(k){S.pos=k;S.errs.pos=null;R();};
window.PA=function(id,val){S.ans[id]=String(val);R();};
window.EX=function(id){S.expandId=S.expandId===id?null:id;R();};

window.doMgr=function(){
  var n=(document.getElementById('mn')||{}).value||'';
  var p=(document.getElementById('mp')||{}).value||'';
  n=n.trim();
  if(!n){S.errs={mgr:"Ism Familiyangizni kiriting"};R();return;}
  if(p!==MGR_PASS){S.errs={mgr:"Parol noto'g'ri"};R();return;}
  S.mgr=true;S.mgrName=n;S.errs={};S.page='home';
  loadExams().then(function(){R();});
};

window.doLogout=function(){
  S.mgr=false;S.mgrName='';S.tab='manager';S.exams=[];R();
};

window.goE2=function(){
  var n=(document.getElementById('fn')||{}).value||'';
  var e=(document.getElementById('fe')||{}).value||'';
  var p=(document.getElementById('fp')||{}).value||'';
  var b=(document.getElementById('fb')||{}).value||'';
  var a=(document.getElementById('fa')||{}).value||'';
  n=n.trim();e=e.trim();p=p.trim();b=b.trim();a=a.trim();
  S.name=n;S.email=e;S.phone=p;S.bdate=b;S.address=a;
  var errs={};
  if(n.length<3) errs.name="Ism kamida 3 harfdan iborat bo'lsin";
  if(!vEmail(e)) errs.email="To'g'ri email kiriting (masalan: ism@gmail.com)";
  if(!vPhone(p)) errs.phone="To'g'ri telefon kiriting (+998901234567)";
  if(!b) errs.bdate="Tug'ilgan sanani kiriting";
  if(a.length<5) errs.address="Manzilni to'liq kiriting";
  S.errs=errs;
  if(Object.keys(errs).length>0){R();return;}
  S.step=2;R();
};

window.goE3=function(){
  if(!S.pos){S.errs={pos:true};R();return;}
  S.errs={};S.step=3;S.ans={};S.qstep=0;R();
};

window.submitExam=async function(){
  var qs=POS[S.pos].q;
  var sc=score(S.ans,qs);
  var final=sc;
  var data={
    employeeName:S.name,email:S.email,phone:S.phone,
    bdate:S.bdate,address:S.address,position:S.pos,
    answers:S.ans,empScore:sc,finalScore:final,
    date:new Date().toLocaleDateString('uz-UZ'),
    timestamp:Date.now(),
  };
  try{
    await addDoc(collection(db,'exams'),data);
    // Telegram xabar
    var pos=POS[S.pos];
    var msg='<b>🆕 Yangi imtihon natijasi</b>\n\n'
      +'<b>Ism:</b> '+S.name+'\n'
      +'<b>Kasb:</b> '+(pos?pos.l:S.pos)+'\n'
      +'<b>Email:</b> '+S.email+'\n'
      +'<b>Telefon:</b> '+S.phone+'\n'
      +'<b>Tug\'ilgan sana:</b> '+S.bdate+'\n'
      +'<b>Manzil:</b> '+S.address+'\n'
      +'<b>Ball:</b> '+final+'%\n'
      +'<b>Holat:</b> '+(final>=85?'✅ Qabul':final>=65?'⚠️ Monitoring':'❌ Rad')+'\n\n'
      +'<b>Savol va javoblar:</b>\n';
    qs.forEach(function(q,i){
      var idx=parseInt(S.ans[q.id]);
      var at=(!isNaN(idx)&&q.o[idx])?q.o[idx]:'Javob berilmagan';
      msg+=(i+1)+'. '+q.t+'\n→ '+at+'\n';
    });
    await sendTelegram(msg);
    S.result=data;
    R();
  }catch(err){
    toast('Xatolik: '+err.message,'d');
    S.result=data;R();
  }
};

async function loadExams(){
  try{
    var snap=await getDocs(query(collection(db,'exams'),orderBy('timestamp','desc')));
    S.exams=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
  }catch(e){console.warn(e);}
}

function toast(m,t){
  S.toast={m:m,t:t||'s'};R();
  setTimeout(function(){S.toast=null;R();},3000);
}

// ── START ──
R();
</script>
