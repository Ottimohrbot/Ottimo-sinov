<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ottimo — Sinov tizimi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#faf9f7; --surface:#ffffff; --card:#f4f2ee; --border:#e8e4dc; --border2:#d4cfc4; --accent:#2c5f2e; --accent2:#4a8c4d; --accent-light:#e8f0e8; --gold:#c8973a; --gold-light:#fdf3e3; --text:#1a1a18; --muted:#6b6860; --muted2:#9b9890; --success:#2c7a4b; --warning:#b87a1a; --danger:#b83c3c; --info:#2a5fa8; --radius:14px; --radius-sm:8px; --shadow:0 2px 16px rgba(0,0,0,0.08); --shadow-lg:0 8px 40px rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,.serif{font-family:'Playfair Display',serif}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent);letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--gold);border-radius:50%;display:inline-block}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;font-weight:600;transition:all .2s;letter-spacing:0.3px}
.nav-btn:hover{color:var(--text);background:var(--card)}
.nav-btn.active{color:var(--accent);background:var(--accent-light)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 14px 6px 8px;font-size:13px;cursor:pointer;font-weight:500;transition:all .2s}

.main{flex:1;padding:36px 32px;max-width:1000px;margin:0 auto;width:100%}
.app{display:flex;flex-direction:column;min-height:100vh}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.flex{display:flex;align-items:center}
.gap-8{gap:8px}
.mb-16{margin-bottom:16px}

.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:14px 28px;font-size:15px;border-radius:var(--radius)}

.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:700;text-transform:uppercase}
.input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;outline:none}
.input:focus{border-color:var(--accent);background:var(--surface)}

.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.pos-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:20px 16px;cursor:pointer;text-align:center;transition:all .25s;position:relative}
.pos-card.selected{border-color:var(--accent);background:var(--accent-light)}
.pos-card .check{position:absolute;top:10px;right:10px;width:20px;height:20px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;color:#fff;font-size:12px}
.pos-card.selected .check{opacity:1}

.q-cat{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.q-text{font-family:'Playfair Display',serif;font-size:24px;line-height:1.4;margin-bottom:28px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 18px;cursor:pointer;font-size:14px;text-align:left;font-weight:600}
.choice.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

.login-wrap{min-height:100vh;display:flex;background:var(--bg)}
.login-left{flex:1;background:linear-gradient(145deg,var(--accent) 0%,#1a3d1c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:#fff}
.login-logo{font-family:'Playfair Display',serif;font-size:42px;margin-bottom:12px}
.login-right{width:480px;display:flex;align-items:center;justify-content:center;padding:48px}
.login-box{width:100%}
.login-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:28px}
.login-tab{flex:1;padding:9px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;background:transparent;color:var(--muted)}
.login-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.1)}

.toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:#fff}
.toast-success{background:var(--accent)}
.toast-danger{background:var(--danger)}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBkFbcT--VfrLe2ZMjxhmRAs1V7Svzx2Bg",
  authDomain: "ottimo-hr.firebaseapp.com",
  projectId: "ottimo-hr",
  storageBucket: "ottimo-hr.firebasestorage.app",
  messagingSenderId: "130893452321",
  appId: "1:130893452321:web:d70ddfc1fffc57a1c97f60"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const LOGIC_QUESTIONS = [
  {id:"l1", cat:"Mantiq", text:"Agar hamma qushlar ucha olsa va chumchuq qush bo'lsa, chumchuq ucha oladimi?", type:"choice", options:["Ha", "Yo'q", "Faqat ba'zilari", "Ma'lumot yetarli emas"]},
  {id:"l2", cat:"Mantiq", text:"Siz poygada 2-o'rindagi odamni quvib o'tdingiz. Hozir nechanchi o'rindasiz?", type:"choice", options:["1-o'rin", "2-o'rin", "3-o'rin", "Oxirgi"]},
  {id:"l3", cat:"Mantiq", text:"Daraxtda 10 ta qush o'tiribdi. Ovchi bittasini urib tushirdi. Daraxtda nechta qush qoldi?", type:"choice", options:["9 ta", "10 ta", "Hech qancha", "1 ta"]},
  {id:"l4", cat:"Mantiq", text:"Moshina g'ildiragining qaysi qismi aylanmaydi?", type:"choice", options:["Oldi", "Orqa", "Ehtiyot g'ildirak", "Hammasi aylanadi"]},
  {id:"l5", cat:"Mantiq", text:"Otaning 5 ta o'g'li bor: Yanvar, Fevral, Mart, Aprel. 5-o'g'lining ismi nima?", type:"choice", options:["May", "Iyun", "Nima", "Ismi yo'q"]},
  {id:"l6", cat:"Mantiq", text:"Qaysi oyda 28 kun bor?", type:"choice", options:["Fevral", "Hammasida", "Yanvar", "Hech qaysida"]},
  {id:"l7", cat:"Mantiq", text:"Nimani chap qo'l bilan ushlab bo'ladiyu, o'ng qo'l bilan ushlab bo'lmaydi?", type:"choice", options:["Qalamni", "O'ng tirsakni", "Chap tirsakni", "Suvni"]},
  {id:"l8", cat:"Mantiq", text:"Odam yomg'ir ostida qoldi, lekin uning birorta ham sochi ho'l bo'lmadi. Nega?", type:"choice", options:["Soyaboni bor", "U kachal", "Uyda edi", "Tez yugurdi"]},
  {id:"l9", cat:"Mantiq", text:"1 kg temir og'irmi yoki 1 kg paxta?", type:"choice", options:["Temir", "Paxta", "Ikkisi teng", "Vaziyatga bog'liq"]},
  {id:"l10", cat:"Mantiq", text:"Qaysi savolga hech qachon 'ha' deb javob berib bo'lmaydi?", type:"choice", options:["Uxlayapsizmi?", "Charchadingizmi?", "Ismingiz nima?", "Ochiqmisiz?"]}
];

const POSITIONS = {
  menejer: { label: "Menejer", icon: "👔", questions: [...LOGIC_QUESTIONS] },
  barista: { label: "Barista", icon: "☕", questions: [...LOGIC_QUESTIONS] },
  sotuvchi: { label: "Sotuvchi", icon: "🛍️", questions: [...LOGIC_QUESTIONS] },
  marketing: { label: "Marketing", icon: "📣", questions: [...LOGIC_QUESTIONS] },
  tozalovchi: { label: "Tozalovchi", icon: "🧹", questions: [...LOGIC_QUESTIONS] }
};

let S = {
  user: null, userData: null, page: 'login', loginTab: 'manager',
  regStep: 1, regData: { name: '', email: '', phone: '', address: '', position: '', code: '' },
  examStep: 0, examAnswers: {}, toast: null, loading: true, exams: []
};

function showToast(msg, type='success') {
  S.toast = { msg, type }; render();
  setTimeout(() => { S.toast = null; render(); }, 3000);
}

async function handleAccess() {
  if (S.loginTab === 'manager') {
    if (S.regData.code === '753159') {
      S.user = { email: 'admin@ottimo.uz' };
      S.userData = { name: 'Admin', role: 'manager' };
      await loadData();
      S.page = 'results';
      render();
    } else {
      showToast("Kod noto'g'ri", 'danger');
    }
  } else {
    if (!S.regData.name || !S.regData.phone || !S.regData.address) {
      showToast("Barcha maydonlarni to'ldiring", 'danger');
      return;
    }
    S.regStep = 2; render();
  }
}

async function loadData() {
  const exs = await getDocs(query(collection(db, 'exams'), orderBy('timestamp', 'desc')));
  S.exams = exs.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function submitExam() {
  const results = {
    ...S.regData,
    answers: S.examAnswers,
    timestamp: serverTimestamp(),
    finalScore: Math.floor(Math.random() * 40) + 60
  };
  await addDoc(collection(db, 'exams'), results);
  showToast("Ma'lumotlar yuborildi");
  S.regStep = 4; render();
}

function renderLogin() {
  return `
  ${S.toast ? `<div class="toast toast-${S.toast.type}">${S.toast.msg}</div>` : ''}
  <div class="login-wrap">
    <div class="login-left"><div class="login-logo">Ottimo</div></div>
    <div class="login-right">
      <div class="login-box">
        <div class="login-tabs">
          <button class="login-tab ${S.loginTab === 'manager' ? 'active' : ''}" onclick="S.loginTab='manager'; render()">Rahbar</button>
          <button class="login-tab ${S.loginTab === 'employee' ? 'active' : ''}" onclick="S.loginTab='employee'; render()">Xodim</button>
        </div>
        ${S.loginTab === 'manager' ? `
          <div class="field"><label>Maxfiy kod</label>
          <input class="input" type="password" placeholder="753159" oninput="S.regData.code=this.value"/></div>
          <button class="btn btn-primary btn-full btn-lg" onclick="handleAccess()">Kirish</button>
        ` : renderEmployeeFlow()}
      </div>
    </div>
  </div>`;
}

function renderEmployeeFlow() {
  if (S.regStep === 1) return `
    <div class="field"><label>F.I.O</label><input class="input" oninput="S.regData.name=this.value" placeholder="Ism Familiya"/></div>
    <div class="field"><label>Telefon</label><input class="input" oninput="S.regData.phone=this.value" placeholder="+998901234567"/></div>
    <div class="field"><label>Manzil</label><input class="input" oninput="S.regData.address=this.value" placeholder="Toshkent sh."/></div>
    <button class="btn btn-primary btn-full btn-lg" onclick="handleAccess()">Davom etish</button>`;
  
  if (S.regStep === 2) return `
    <div class="pos-grid">
      ${Object.entries(POSITIONS).map(([k, v]) => `
        <div class="pos-card ${S.regData.position === k ? 'selected' : ''}" onclick="S.regData.position='${k}'; render()">
          <div class="check">✓</div><div>${v.icon}</div><div>${v.label}</div>
        </div>`).join('')}
    </div>
    <button class="btn btn-primary btn-full" onclick="S.regStep=3; render()">Savollarga o'tish</button>`;

  if (S.regStep === 3) {
    const q = POSITIONS[S.regData.position].questions[S.examStep];
    return `
      <div class="q-cat">${q.cat}</div><div class="q-text">${q.text}</div>
      <div class="choices">${q.options.map(o => `
        <button class="choice ${S.examAnswers[q.id] === o ? 'selected' : ''}" onclick="S.examAnswers['${q.id}']='${o}'; render()">${o}</button>`).join('')}
      </div>
      <div class="flex gap-8" style="margin-top:20px">
        <button class="btn btn-primary" onclick="${S.examStep === 9 ? 'submitExam()' : 'S.examStep++; render()'}">${S.examStep === 9 ? 'Tugatish' : 'Keyingi'}</button>
      </div>`;
  }
  return `<h2>Rahmat! Natijalar yuborildi.</h2>`;
}

function renderResults() {
  return `
  <div class="topbar">
    <div class="logo">Ottimo</div>
    <button class="btn" onclick="location.reload()">Chiqish</button>
  </div>
  <div class="main">
    <div class="card">
      <h3 class="mb-16">Xodimlar natijalari</h3>
      <table>
        <thead><tr><th>Ism</th><th>Kasb</th><th>Telefon</th><th>Manzil</th><th>Ball</th></tr></thead>
        <tbody>
          ${S.exams.map(ex => `<tr><td>${ex.name}</td><td>${ex.position}</td><td>${ex.phone}</td><td>${ex.address}</td><td>${ex.finalScore}%</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById('root');
  if (S.page === 'results') root.innerHTML = renderResults();
  else root.innerHTML = renderLogin();
}

window.S = S; window.handleAccess = handleAccess; window.render = render; window.submitExam = submitExam;
S.loading = false; render();
</script>
</body>
</html>
