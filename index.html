<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ottimo HR — Sinov tizimi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0d0f;
  --surface: #141416;
  --card: #1c1c20;
  --border: #2a2a30;
  --border2: #363640;
  --accent: #c8a96e;
  --accent2: #e8c98a;
  --text: #f0ede8;
  --muted: #7a7880;
  --muted2: #5a5860;
  --success: #4a9d6f;
  --warning: #c8893a;
  --danger: #b84a4a;
  --info: #4a7cb8;
  --radius: 12px;
  --radius-sm: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:'DM Serif Display',serif;font-weight:400}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent);letter-spacing:0.5px}
.logo span{color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;margin-left:8px;color:var(--muted)}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;border:none;color:var(--muted);padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .2s}
.nav-btn:hover{color:var(--text);background:var(--card)}
.nav-btn.active{color:var(--accent);background:var(--card)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 6px;font-size:13px;cursor:pointer}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--bg)}
.main{flex:1;padding:32px 28px;max-width:960px;margin:0 auto;width:100%}

/* ── CARDS & COMMON ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.section-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mb-8{margin-bottom:8px}.mb-14{margin-bottom:14px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}

/* ── STAT CARD ── */
.stat-val{font-family:'DM Serif Display',serif;font-size:36px;color:var(--accent);line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.badge-green{background:#4a9d6f22;color:#4a9d6f;border:1px solid #4a9d6f44}
.badge-amber{background:#c8893a22;color:#c8893a;border:1px solid #c8893a44}
.badge-red{background:#b84a4a22;color:#b84a4a;border:1px solid #b84a4a44}
.badge-blue{background:#4a7cb822;color:#4a7cb8;border:1px solid #4a7cb844}
.badge-gold{background:#c8a96e22;color:#c8a96e;border:1px solid #c8a96e44}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:10px 18px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-danger{background:#b84a4a22;color:#b84a4a;border:1px solid #b84a4a44}
.btn-danger:hover{background:#b84a4a33}
.btn-success{background:#4a9d6f22;color:#4a9d6f;border:1px solid #4a9d6f44}
.btn-success:hover{background:#4a9d6f33}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-full{width:100%;justify-content:center}

/* ── INPUTS ── */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border .2s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--muted2)}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:90px}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
td{padding:13px 14px;border-bottom:1px solid var(--border);font-size:14px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface)}

/* ── PROGRESS ── */
.progress-bar{height:6px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;border-radius:10px;transition:width .5s}

/* ── STAR ── */
.stars{display:flex;gap:5px}
.star{font-size:26px;cursor:pointer;color:var(--border2);transition:all .15s;user-select:none}
.star.on{color:var(--accent)}
.star:hover{transform:scale(1.15)}

/* ── CHOICE ── */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;cursor:pointer;font-size:14px;text-align:left;color:var(--text);font-family:'DM Sans',sans-serif;transition:all .2s}
.choice:hover{border-color:var(--border2)}
.choice.selected{background:var(--accent)18;border-color:var(--accent);color:var(--accent)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:20px}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
.login-box{width:100%;max-width:400px}
.login-logo{font-family:'DM Serif Display',serif;font-size:32px;color:var(--accent);margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.login-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:24px}
.login-tab{flex:1;padding:8px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;background:transparent;color:var(--muted);transition:all .2s}
.login-tab.active{background:var(--card);color:var(--text)}

/* ── TOAST ── */
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;animation:fadeIn .3s;box-shadow:0 4px 24px #0006}
.toast-success{background:#4a9d6f;color:#fff}
.toast-danger{background:#b84a4a;color:#fff}
.toast-info{background:#4a7cb8;color:#fff}

/* ── EXAM ── */
.exam-wrap{max-width:680px;margin:0 auto}
.exam-header{margin-bottom:28px}
.exam-progress{height:4px;background:var(--border);border-radius:10px;overflow:hidden;margin-top:12px}
.exam-fill{height:100%;background:var(--accent);border-radius:10px;transition:width .4s}
.exam-step{font-size:12px;color:var(--muted);margin-top:6px}
.q-category{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.q-text{font-family:'DM Serif Display',serif;font-size:22px;line-height:1.4;margin-bottom:24px}
.exam-nav{display:flex;justify-content:space-between;margin-top:24px}

/* ── RESULT ── */
.result-score{font-family:'DM Serif Display',serif;font-size:72px;line-height:1;margin:12px 0}
.result-icon{font-size:48px;margin-bottom:8px}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .grid-4{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:1fr 1fr}
  .grid-2{grid-template-columns:1fr}
  .topbar{padding:0 16px}
  .main{padding:20px 16px}
  .nav-btn span{display:none}
}

@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .35s ease}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, query, orderBy, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ══════════════════════════════════════════════════
// FIREBASE CONFIG — O'zgartiring!
// ══════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyBkFbcT--VfrLe2ZMjxhmRAs1V7Svzx2Bg",
  authDomain: "ottimo-hr.firebaseapp.com",
  projectId: "ottimo-hr",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "130893452321",
  appId: "1:130893452321:web:d70ddfc1fffc57a1c97f60"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let state = {
  user: null,
  userRole: null, // 'manager' | 'employee'
  userData: null,
  page: 'login',
  loginTab: 'manager',
  employees: [],
  exams: [],
  questions: defaultQuestions(),
  // Modals
  showAddEmployee: false,
  showAddQuestion: false,
  // Exam
  activeEmployee: null,
  examAnswers: {},
  examStep: 0,
  examDone: false,
  examResult: null,
  managerScore: 3,
  managerNote: '',
  // Form
  newEmp: { name:'', position:'', department:'', startDate:'', phone:'', email:'' },
  newQ: { text:'', type:'rating', category:'', options:'' },
  // UI
  search: '',
  loading: false,
  toast: null,
};

function defaultQuestions() {
  return [
    { id:'q1', text:"Ish jarayonida eng katta qiyinchiligi qanday hal qildingiz?", type:"text",   category:"Amaliy tajriba" },
    { id:'q2', text:"Muloqot va hamkorlik qobiliyatingiz", type:"rating", category:"Yumshoq ko'nikmalar" },
    { id:'q3', text:"Belgilangan muddatlarga rioya qilish darajangiz", type:"rating", category:"Intizom" },
    { id:'q4', text:"Jamoangiz bilan ishlash qanday kechdi?", type:"choice", category:"Jamoa ruhi", options:["Juda yaxshi","Yaxshi","O'rtacha","Qiyin bo'ldi"] },
    { id:'q5', text:"Kompaniya qoidalarini qanchalik tushundingiz?", type:"choice", category:"Intizom", options:["Ha, to'liq","Ko'pini tushundim","Qisman","Yo'q"] },
    { id:'q6', text:"Dastlabki oyda o'rganganlaringiz", type:"text", category:"Rivojlanish" },
    { id:'q7', text:"Vazifalarni mustaqil bajarish darajangiz", type:"rating", category:"Mustaqillik" },
    { id:'q8', text:"Keyingi oylarda rivojlanish rejangiz", type:"text", category:"Rivojlanish" },
  ];
}

// ══════════════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════════════
function render() {
  const root = document.getElementById('root');
  if (!state.user) {
    root.innerHTML = renderLogin();
  } else {
    root.innerHTML = renderApp();
  }
  attachEvents();
}

// ══════════════════════════════════════════════════
// LOGIN PAGE
// ══════════════════════════════════════════════════
function renderLogin() {
  return `
  <div class="login-wrap">
    <div class="login-box slide-up">
      <div class="login-logo">Ottimo</div>
      <div class="login-sub">HR sinov va baholash tizimi</div>
      <div class="login-tabs">
        <button class="login-tab ${state.loginTab==='manager'?'active':''}" onclick="setLoginTab('manager')">Menejer</button>
        <button class="login-tab ${state.loginTab==='employee'?'active':''}" onclick="setLoginTab('employee')">Hodim</button>
      </div>
      <div class="field"><label>Email</label><input class="input" id="login-email" type="email" placeholder="email@ottimo.uz"/></div>
      <div class="field"><label>Parol</label><input class="input" id="login-pass" type="password" placeholder="••••••••"/></div>
      ${state.loginTab==='manager'?`
      <div class="field"><label>Ism (yangi hisob uchun)</label><input class="input" id="login-name" placeholder="Ism Familiya"/></div>
      `:''}
      <button class="btn btn-primary btn-full" style="margin-bottom:10px" onclick="doLogin()">
        ${state.loginTab==='manager'?'Kirish yoki ro\'yxatdan o\'tish':'Kirish'}
      </button>
      ${state.loginTab==='employee'?`<p style="font-size:12px;color:var(--muted);text-align:center">Hisob menejer tomonidan yaratiladi</p>`:''}
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════
function renderApp() {
  const isManager = state.userRole === 'manager';
  const pages = isManager
    ? ['home','employees','results','questions']
    : ['exam-home','my-results'];

  let content = '';
  if (state.page === 'login') state.page = isManager ? 'home' : 'exam-home';

  if (state.page === 'home') content = renderHome();
  else if (state.page === 'employees') content = renderEmployees();
  else if (state.page === 'results') content = renderResults();
  else if (state.page === 'questions') content = renderQuestions();
  else if (state.page === 'exam') content = renderExam();
  else if (state.page === 'exam-home') content = renderExamHome();
  else if (state.page === 'my-results') content = renderMyResults();

  const navLabels = {
    'home':'Bosh sahifa','employees':'Hodimlar','results':'Natijalar','questions':'Savollar',
    'exam-home':'Imtihon','my-results':'Mening natijalarim'
  };

  return `
  ${state.toast ? `<div class="toast toast-${state.toast.type}">${state.toast.msg}</div>` : ''}
  <div class="app">
    <div class="topbar">
      <div class="flex gap-8">
        <div class="logo">Ottimo <span>HR</span></div>
      </div>
      <nav class="nav">
        ${pages.map(p=>`<button class="nav-btn ${state.page===p||state.page==='exam'&&p==='employees'?'active':''}" onclick="goPage('${p}')"><span>${navLabels[p]}</span></button>`).join('')}
      </nav>
      <div class="topbar-right">
        <div class="user-chip" onclick="doLogout()">
          <div class="avatar">${(state.userData?.name||state.user.email)[0].toUpperCase()}</div>
          <span style="font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${state.userData?.name||state.user.email}</span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="color:var(--muted)"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
      </div>
    </div>
    <div class="main">
      ${content}
      ${state.showAddEmployee ? renderAddEmployeeModal() : ''}
      ${state.showAddQuestion ? renderAddQuestionModal() : ''}
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════════
function renderHome() {
  const passed = state.exams.filter(e=>e.finalScore>=85).length;
  const monitor = state.exams.filter(e=>e.finalScore>=65&&e.finalScore<85).length;
  const failed  = state.exams.filter(e=>e.finalScore<65).length;
  const avg = state.exams.length ? Math.round(state.exams.reduce((a,e)=>a+e.finalScore,0)/state.exams.length) : 0;
  const recent = [...state.exams].sort((a,b)=>b.timestamp-a.timestamp).slice(0,5);

  return `
  <div class="slide-up">
    <div class="flex-between mb-24">
      <div>
        <h1 style="font-size:28px;margin-bottom:4px">Bosh sahifa</h1>
        <p style="color:var(--muted);font-size:14px">Ottimo HR — sinov muddati boshqaruvi</p>
      </div>
      <button class="btn btn-primary" onclick="setState({showAddEmployee:true})">+ Hodim qo'shish</button>
    </div>
    <div class="grid-4 mb-24">
      ${[
        {label:'Jami hodimlar',val:state.employees.length,color:'var(--accent)'},
        {label:'Qabul qilindi',val:passed,color:'var(--success)'},
        {label:'Monitoring',val:monitor,color:'var(--warning)'},
        {label:"O'rtacha ball",val:avg+'%',color:'var(--info)'},
      ].map(s=>`
        <div class="card-sm">
          <div class="stat-val" style="color:${s.color}">${s.val}</div>
          <div class="stat-label">${s.label}</div>
        </div>`).join('')}
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="section-title">So'nggi imtihonlar</div>
        ${recent.length===0?`<p style="color:var(--muted);font-size:14px;text-align:center;padding:20px 0">Hali imtihon yo'q</p>`:
          recent.map(ex=>`
          <div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
            <div class="flex gap-12">
              <div class="avatar" style="width:34px;height:34px;font-size:13px;flex-shrink:0">${ex.employeeName[0]}</div>
              <div>
                <div style="font-size:14px;font-weight:500">${ex.employeeName}</div>
                <div style="font-size:12px;color:var(--muted)">${ex.position||''} · ${ex.date||''}</div>
              </div>
            </div>
            <div class="flex gap-8">
              <span style="font-size:18px;font-weight:600;color:${ex.finalScore>=85?'var(--success)':ex.finalScore>=65?'var(--warning)':'var(--danger)'}">${ex.finalScore}%</span>
              ${scoreBadge(ex.finalScore)}
            </div>
          </div>`).join('')}
      </div>
      <div class="card">
        <div class="section-title">Tezkor harakatlar</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-ghost btn-full" style="justify-content:flex-start" onclick="goPage('employees')">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Hodimlar ro'yxati
          </button>
          <button class="btn btn-ghost btn-full" style="justify-content:flex-start" onclick="goPage('results')">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="10" width="3" height="4" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="6.5" y="6" width="3" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="2" width="3" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
            Barcha natijalar
          </button>
          <button class="btn btn-ghost btn-full" style="justify-content:flex-start" onclick="goPage('questions')">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M5 8h6M5 5.5h6M5 10.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Savollarni boshqarish
          </button>
        </div>
        <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
          <div class="section-title">Sinov muddati tugayotganlar</div>
          ${state.employees.filter(e=>{
            if(!e.startDate) return false;
            const d = daysLeft(e.startDate);
            return d>=0 && d<=7;
          }).length===0
            ? `<p style="font-size:13px;color:var(--muted)">Hech kim yo'q</p>`
            : state.employees.filter(e=>{
                if(!e.startDate) return false;
                const d = daysLeft(e.startDate);
                return d>=0 && d<=7;
              }).map(e=>`

// ══════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════
function scoreBadge(s) {
  if (s>=85) return `<span class="badge badge-green">Qabul</span>`;
  if (s>=65) return `<span class="badge badge-amber">Monitoring</span>`;
  return `<span class="badge badge-red">Rad</span>`;
}
function daysLeft(startDate) {
  const start = new Date(startDate);
  const end   = new Date(start.getTime() + 30*24*60*60*1000);
  return Math.ceil((end - new Date()) / (1000*60*60*24));
}
function computeScore(answers) {
  let total=0, count=0;
  state.questions.forEach(q=>{
    if (q.type==='rating') {
      total += ((answers[q.id]||3)/5)*100; count++;
    } else if (q.type==='choice') {
      const idx = (q.options||[]).indexOf(answers[q.id]);
      if (idx>=0) { total += ((q.options.length-idx)/q.options.length)*100; count++; }
    }
  });
  return count ? Math.round(total/count) : 50;
}

// ── AUTH ──
window.doLogin = async () => {
  const email = document.getElementById('login-email')?.value?.trim();
  const pass  = document.getElementById('login-pass')?.value;
  const name  = document.getElementById('login-name')?.value?.trim();
  if (!email||!pass) return showToast('Email va parol kiriting','danger');
  try {
    let cred;
    if (state.loginTab==='manager') {
      try {
        cred = await signInWithEmailAndPassword(auth, email, pass);
      } catch {
        if (!name) return showToast("Yangi hisob: ismingizni kiriting",'danger');
        cred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db,'users',cred.user.uid),{ name, email, role:'manager', createdAt:serverTimestamp() });
      }
    } else {
      cred = await signInWithEmailAndPassword(auth, email, pass);
      const userDoc = await getDoc(doc(db,'users',cred.user.uid));
      if (!userDoc.exists() || userDoc.data().role!=='employee') {
        await signOut(auth);
        return showToast("Hodim hisobi topilmadi",'danger');
      }
    }
  } catch(err) {
    showToast(err.code==='auth/wrong-password'?'Parol noto\'g\'ri':err.code==='auth/user-not-found'?'Foydalanuvchi topilmadi':'Xatolik: '+err.message,'danger');
  }
};

window.doLogout = async () => { await signOut(auth); };

// ── DATA ──
window.addEmployee = async () => {
  const e = state.newEmp;
  if (!e.name||!e.position) return showToast('Ism va lavozim kerak','danger');
  try {
    const docRef = await addDoc(collection(db,'employees'),{
      ...e, createdAt:serverTimestamp(), status:'active', managerId:state.user.uid
    });
    // Create employee login if email provided
    if (e.email) {
      // Store pending account in Firestore (admin creates accounts separately)
      await setDoc(doc(db,'pending_accounts',docRef.id),{ email:e.email, name:e.name, employeeId:docRef.id });
    }
    state.newEmp = { name:'',position:'',department:'',startDate:'',phone:'',email:'' };
    setState({ showAddEmployee:false });
    await loadData();
    showToast('Hodim qo\'shildi ✓');
  } catch(err) { showToast('Xatolik: '+err.message,'danger'); }
};

window.removeQuestion = async (id) => {
  state.questions = state.questions.filter(q=>q.id!==id);
  await setDoc(doc(db,'questions','default'),{ list: state.questions });
  render();
  showToast("Savol o'chirildi");
};

window.addQuestion = async () => {
  const q = state.newQ;
  if (!q.text||!q.category) return showToast('Savol va kategoriya kerak','danger');
  const newQ = {
    id:'q'+Date.now(), text:q.text, type:q.type, category:q.category,
    options: q.type==='choice' ? q.options.split(',').map(s=>s.trim()).filter(Boolean) : undefined
  };
  state.questions = [...state.questions, newQ];
  await setDoc(doc(db,'questions','default'),{ list: state.questions });
  state.newQ = { text:'',type:'rating',category:'',options:'' };
  setState({ showAddQuestion:false });
  showToast('Savol qo\'shildi ✓');
};

window.startExam = (empId) => {
  const emp = state.employees.find(e=>e.id===empId);
  setState({ activeEmployee:emp, examAnswers:{}, examStep:0, examDone:false, examResult:null, managerScore:3, managerNote:'', page:'exam' });
};

window.startSelfExam = () => {
  setState({ activeEmployee:{ name:state.userData?.name||state.user.email, position:state.userData?.position||'', id:state.user.uid, email:state.user.email }, examAnswers:{}, examStep:0, examDone:false, examResult:null, managerScore:3, managerNote:'', page:'exam' });
};

window.submitExam = async () => {
  const el = document.getElementById('mgr-note');
  if (el) state.managerNote = el.value;
  const empScore = computeScore(state.examAnswers);
  const mScore   = Math.round((state.managerScore/5)*100);
  const final    = Math.round(empScore*0.6 + mScore*0.4);
  const result = {
    employeeId: state.activeEmployee.id,
    employeeName: state.activeEmployee.name,
    employeeEmail: state.activeEmployee.email||'',
    position: state.activeEmployee.position||'',
    answers: state.examAnswers,
    empScore, mScore, managerNote: state.managerNote,
    finalScore: final,
    date: new Date().toLocaleDateString('uz-UZ'),
    timestamp: Date.now(),
    managerId: state.user.uid,
  };
  try {
    await addDoc(collection(db,'exams'), result);
    if (state.activeEmployee.id && state.activeEmployee.id !== state.user.uid) {
      const empRef = doc(db,'employees',state.activeEmployee.id);
      await updateDoc(empRef, {
        lastScore: final,
        status: final>=85?'passed':final>=65?'monitor':'failed'
      }).catch(()=>{});
    }
    await loadData();
    setState({ examDone:true, examResult:result });
  } catch(err) { showToast('Saqlashda xatolik: '+err.message,'danger'); }
};

// ── LOAD DATA ──
async function loadData() {
  try {
    const [empsSnap, examsSnap, qSnap] = await Promise.all([
      getDocs(query(collection(db,'employees'))),
      getDocs(query(collection(db,'exams'), orderBy('timestamp','desc'))),
      getDoc(doc(db,'questions','default')),
    ]);
    state.employees = empsSnap.docs.map(d=>({id:d.id,...d.data()}));
    state.exams = examsSnap.docs.map(d=>({id:d.id,...d.data()}));
    if (qSnap.exists() && qSnap.data().list?.length) state.questions = qSnap.data().list;
  } catch(e) { console.warn('Load error:',e); }
}

// ── AUTH STATE ──
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const userDoc = await getDoc(doc(db,'users',user.uid));
    state.user = user;
    state.userData = userDoc.exists() ? userDoc.data() : null;
    state.userRole = state.userData?.role || 'employee';
    state.page = state.userRole==='manager' ? 'home' : 'exam-home';
    await loadData();
  } else {
    state.user = null;
    state.userData = null;
    state.userRole = null;
    state.page = 'login';
  }
  render();
});

// ── ATTACH EVENTS ──
function attachEvents() {
  // Nothing extra needed, using inline handlers
}

// Initial render
render();
</script>
